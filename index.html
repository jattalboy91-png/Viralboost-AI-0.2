    function showToast(msg, type = 'info') {

        ? 'bg-emerald-950/95 border-emerald-400 text-emerald-100'

          ? 'bg-red-950/95 border-red-400 text-red-100'
          : 'bg-slate-900/95 border-cyan-400 text-slate-100';
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl border text-xs font-bold shadow-2xl backdrop-blur-md transition-all ${colors}`;
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 250);
      }, 2800);

    function copyText(text, label = 'Copied to clipboard') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`📋 ${label}`, 'success')).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(`📋 ${label}`, 'success'); } catch (e) {}
      ta.remove();
    }

    function shareContent(title, text, url) {

            </button>
            ${cloudUser ? `
              <div class="rounded-xl bg-emerald-950/60 border border-emerald-400/50 px-3 py-2 flex items-center justify-between text-[11px]">
                <span class="text-emerald-300 font-bold truncate">✅ Google Connected: ${escapeHtml(cloudUser.email || cloudUser.uid)}</span>

                <span>✉️</span><span>Email &amp; Password</span>

            ${!isMobile ? `
              <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-950 border border-slate-800 text-[11px]">
                <button type="button" onclick="authUiState.emailMode='signup';authUiState.errorMsg='';renderApp()" class="py-1.5 rounded-lg font-extrabold ${isEmailSignup ? 'bg-cyan-400 text-slate-950' : 'text-slate-400'}">Create Account</button>
                <button type="button" onclick="authUiState.emailMode='signin';authUiState.errorMsg='';renderApp()" class="py-1.5 rounded-lg font-extrabold ${!isEmailSignup ? 'bg-cyan-400 text-slate-950' : 'text-slate-400'}">Sign In</button>

            ${(isMobile || isEmailSignup) ? `

                <input id="auth-fullname-input" type="text" value="${escapeHtml(a.name)}" oninput="authUiState.name=this.value;updateAuthSubmitButtonState()" placeholder="e.g. Aarav Sharma" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-xs text-white outline-none focus:border-cyan-400" />

            <!-- Mobile Number or Email Input -->
            <div>
              <label for="auth-contact-input" class="block text-[11px] font-bold text-slate-300 mb-1">${isMobile ? 'Enter Mobile Number (+91)' : 'Enter Email Address'}</label>
              <input id="auth-contact-input" type="${isMobile ? 'tel' : 'email'}" value="${escapeHtml(a.contact)}" oninput="authUiState.contact=this.value;authUiState.errorMsg='';updateAuthSubmitButtonState()" placeholder="${isMobile ? 'e.g. 9876543210 or +919876543210' : 'e.g. creator@gmail.com'}" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-xs text-white outline-none focus:border-cyan-400" />
            </div>

            ${!isMobile ? `
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label for="auth-password-input" class="block text-[11px] font-bold text-slate-300">Password (min 6 characters)</label>
                  <button type="button" onclick="sendEmailPasswordReset()" class="text-[10.5px] font-bold text-cyan-400 underline">Forgot Password?</button>
                </div>
                <input id="auth-password-input" type="password" value="${escapeHtml(a.password)}" oninput="authUiState.password=this.value;authUiState.errorMsg='';updateAuthSubmitButtonState()" placeholder="Enter password..." class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2.5 text-xs text-white outline-none focus:border-cyan-400" />
              </div>
            ` : ''}

            <!-- Real Firebase Phone Auth 6-Digit SMS OTP Verification Box -->
            ${isMobile && a.otpSent ? `
              <div class="rounded-xl bg-slate-950/90 border border-amber-400/60 p-3 space-y-2">
                <label for="auth-otp-input" class="block text-[11px] font-bold text-amber-300">🔐 Enter Real 6-Digit SMS OTP</label>
                <input id="auth-otp-input" type="tel" maxlength="6" inputmode="numeric" value="${escapeHtml(a.otp)}" oninput="authUiState.otp=this.value.replace(/\\D/g,'').slice(0,6);authUiState.errorMsg='';updateAuthSubmitButtonState()" placeholder="Enter 6-digit SMS OTP" class="w-full rounded-xl bg-slate-900 border border-amber-400/50 px-3 py-2.5 text-sm font-mono font-bold text-white outline-none focus:border-cyan-400" />
                <div class="flex items-center justify-between text-[10.5px]">
                  <span class="text-emerald-300 font-semibold">✓ SMS OTP sent to ${escapeHtml(a.e164 || a.contact)}</span>
                  <button type="button" onclick="sendMobileSignupOtp()" ${a.otpLoading ? 'disabled' : ''} class="text-cyan-300 font-bold underline shrink-0 ml-2 disabled:opacity-50">Resend SMS</button>
                </div>
              </div>
            ` : ''}

            ${a.errorMsg ? `
              <div class="rounded-xl bg-red-950/70 border border-red-500/60 p-2.5 text-[11px] text-red-200 font-semibold">
                ⚠️ ${escapeHtml(a.errorMsg)}
              </div>
            ` : ''}

            <!-- Mandatory Legal Terms & Liability Waiver Checkbox -->
            <label for="auth-terms-checkbox" class="cursor-pointer block rounded-xl p-3 bg-[#1E1735] border transition ${a.agreed ? 'border-emerald-400/80' : 'border-slate-700 hover:border-amber-400/60'}">
              <div class="flex items-start gap-2.5">
                <input id="auth-terms-checkbox" type="checkbox" ${a.agreed ? 'checked' : ''} onchange="authUiState.agreed=this.checked;renderApp()" class="mt-0.5 w-4 h-4 accent-emerald-400 shrink-0 cursor-pointer" />
                <div class="space-y-1">
                  <div class="text-xs font-extrabold text-white flex items-center gap-1.5">
                    <span>⚖️</span>
                    <span>Mandatory Legal Terms & Liability Waiver</span>
                  </div>
                  <p class="text-[11px] text-slate-200 leading-relaxed">
                    I Agree to Terms & Conditions. I understand rewards and deals are provided as-is, releasing the owner from any liability or false claims.
                  </p>
                  <p class="text-[10px] text-cyan-300 font-semibold">
                    🔒 One-time legal agreement proof is timestamped and recorded in Cloud Firestore.
                  </p>
                </div>
              </div>
            </label>

            <!-- Primary CTA Button -->
            <button id="auth-submit-btn" type="button" onclick="${isMobile && !a.otpSent ? 'sendMobileSignupOtp()' : 'completeSecureSignup()'}" ${canSubmit ? '' : 'disabled'} class="w-full py-3 rounded-xl font-display font-extrabold text-xs min-h-[48px] transition shadow-lg ${canSubmit ? (isMobile && !a.otpSent ? 'bg-violet-600 hover:bg-violet-500 text-white' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950') : 'bg-slate-800 text-slate-500 cursor-not-allowed'}">
              ${a.otpLoading ? '⏳ Sending Real SMS OTP...' : a.otpConfirming ? '⏳ Verifying SMS OTP...' : a.emailLoading ? '⏳ Authenticating with Firebase...' : (isMobile && !a.otpSent ? '📱 Send Real SMS OTP' : (isMobile ? '✅ Verify OTP & Complete Sign Up' : (isEmailSignup ? '✅ Create Account & Sign Up' : '🔓 Sign In to Account')))}
            </button>
          </div>

          <!-- Verified Production Endpoint Footer -->
          <div class="text-center text-[10px] text-slate-500 font-mono">
            Live Web: ${CONSTANTS.PRODUCTION_HOST}/Viralboost-AI-0.2 • APK: ${CONSTANTS.ANDROID_PACKAGE_ID}
          </div>
        </div>
      `;
    }

    function updateAuthSubmitButtonState() {
      const btn = document.getElementById('auth-submit-btn');
      if (!btn) return;
      const a = authUiState;
      const isMobile = a.method === 'mobile';
      const isEmailSignup = !isMobile && a.emailMode === 'signup';
      const canSendOtp = isMobile && !a.otpSent && !a.otpLoading && a.name.trim().length >= 2 && a.contact.replace(/\D/g, '').length >= 10;
      const canCompleteSignup = a.agreed &&
        !a.otpLoading &&
        !a.otpConfirming &&
        !a.emailLoading &&
        (isMobile
          ? (a.name.trim().length >= 2 && a.contact.replace(/\D/g, '').length >= 10 && a.otpSent && a.otp.trim().length === 6)
          : (a.contact.trim().length >= 5 && a.password.length >= 6 && (!isEmailSignup || a.name.trim().length >= 2)));
      const canSubmit = (isMobile && !a.otpSent) ? canSendOtp : canCompleteSignup;
      btn.disabled = !canSubmit;
      btn.className = `w-full py-3 rounded-xl font-display font-extrabold text-xs min-h-[48px] transition shadow-lg ${
        canSubmit
          ? (isMobile && !a.otpSent ? 'bg-violet-600 hover:bg-violet-500 text-white' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950')
          : 'bg-slate-800 text-slate-500 cursor-not-allowed'
      }`;
    }

    function selectAuthMethod(method) {
      authUiState.method = method;
      authUiState.otpSent = false;
      authUiState.otp = '';
      authUiState.e164 = '';
      authUiState.errorMsg = '';
      renderApp();
    }

    async function sendEmailPasswordReset() {
      const email = (authUiState.contact || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Enter your registered email address above first!', 'error');
        return;
      }
      try {
        if (window.ViralBoostFirebaseReady) await window.ViralBoostFirebaseReady;
        await window.ViralBoostFirebase.resetPasswordEmail(email);
        showToast(`📩 Password reset link sent to ${email}`, 'success');
      } catch (err) {
        showToast(`⚠️ Reset failed: ${err.message}`, 'error');
      }
    }

    function handleAuthGoogleClick() {
      if (cloudUser) {
        if (!authUiState.agreed) {
          if (!authUiState.name && cloudUser.displayName) authUiState.name = cloudUser.displayName;
          if (!authUiState.contact && cloudUser.email) {
            authUiState.contact = cloudUser.email;
            authUiState.method = 'email';
          }
          renderApp();
          showToast('Please tick "Mandatory Legal Terms & Liability Waiver" to finish!', 'info');
          return;
        }
        const ts = new Date().toISOString();
        const gName = (authUiState.name || cloudUser.displayName || 'Creator').trim();
        const gEmail = (authUiState.contact || cloudUser.email || cloudUser.uid).trim();
        state.profile.username = gName;
        state.profile.email = gEmail;
        state.profile.userContact = gEmail;
        state.profile.authMethod = 'google';
        state.profile.isLoggedIn = true;
        state.profile.hasAgreedToTerms = true;
        state.profile.legalAccepted = true;
        state.profile.legalAgreementTimestamp = ts;
        state.profile.welcomeClaimed = true;
        state.legalAuditLogs.unshift({
          name: gName,
          contact: gEmail,
          method: 'google',
          timestamp: ts,
          status: 'AGREED_AND_VERIFIED'
        });
        saveState();
        syncProfileToCloud();
        renderApp();
        showToast('🟢 Google Cloud Sync Verified! Connected to Firestore.', 'success');
        return;
      }
      if (!authUiState.agreed) {
        showToast('Signing in with Google — tick Legal Terms to unlock Cloud Sync.', 'info');
      }
      authUiState.pendingGoogleSignup = true;
      authUiState.googleLoading = true;
      renderApp();
      triggerGoogleCloudSignIn();
    }

    async function sendMobileSignupOtp() {
      if (authUiState.otpLoading) return;
      const rawContact = (authUiState.contact || '').trim();
      const digits = rawContact.replace(/\D/g, '');
      if (authUiState.name.trim().length < 2) {
        showToast('Please enter your full name first!', 'error');
        return;
      }
      if (digits.length < 10) {
        showToast('Please enter a valid 10-digit mobile number!', 'error');
        return;
      }
      const e164 = rawContact.startsWith('+')
        ? ('+' + digits)
        : ('+91' + digits.slice(-10));

      authUiState.otpLoading = true;
      authUiState.errorMsg = '';
      authUiState.e164 = e164;
      renderApp();

      try {
        if (window.ViralBoostFirebaseReady) {
          await window.ViralBoostFirebaseReady;
        }
        if (!window.ViralBoostFirebase || typeof window.ViralBoostFirebase.sendPhoneOtp !== 'function') {
          throw new Error('Firebase Phone Auth is initializing — try again in a moment.');
        }
        await window.ViralBoostFirebase.sendPhoneOtp(e164);
        authUiState.otpSent = true;
        authUiState.otp = '';
        showToast(`📱 Real SMS OTP sent to ${e164}!`, 'success');
      } catch (err) {
        const msg = String(err?.message || err || 'Could not send SMS OTP.');
        authUiState.errorMsg = msg;
        showToast(`⚠️ SMS OTP Error: ${msg}`, 'error');
      } finally {
        authUiState.otpLoading = false;
        renderApp();
      }
    }

    async function completeSecureSignup() {
      const a = authUiState;
      const isMobile = a.method === 'mobile';
      const isEmailSignup = !isMobile && a.emailMode === 'signup';
      const name = a.name.trim();
      const contact = a.contact.trim();

      if ((isMobile || isEmailSignup) && name.length < 2) {
        showToast('Please enter your full name!', 'error');
        return;
      }
      if (!a.agreed) {
        showToast('Mandatory Legal Terms & Liability Waiver must be accepted!', 'error');
        return;
      }

      let fbUser = null;
      if (isMobile) {
        if (contact.replace(/\D/g, '').length < 10) {
          showToast('Please enter a valid 10-digit mobile number!', 'error');
          return;
        }
        if (!a.otpSent) {
          await sendMobileSignupOtp();
          return;
        }
        if (a.otp.trim().length !== 6) {
          showToast('Enter the exact 6-digit SMS OTP sent to your phone.', 'error');
          return;
        }
        authUiState.otpConfirming = true;
        authUiState.errorMsg = '';
        renderApp();
        try {
          if (!window.ViralBoostFirebase || typeof window.ViralBoostFirebase.confirmPhoneOtp !== 'function') {
            throw new Error('Firebase Phone Auth SDK not ready.');
          }
          fbUser = await window.ViralBoostFirebase.confirmPhoneOtp(a.otp.trim());
        } catch (otpErr) {
          const msg = String(otpErr?.message || otpErr || 'Invalid or expired SMS OTP.');
          authUiState.otpConfirming = false;
          authUiState.errorMsg = msg;
          renderApp();
          showToast(`⚠️ OTP Verification Failed: ${msg}`, 'error');
          return;
        }
        authUiState.otpConfirming = false;
      } else {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)) {
          showToast('Please enter a valid email address!', 'error');
          return;
        }
        if (a.password.length < 6) {
          showToast('Password must be at least 6 characters!', 'error');
          return;
        }
        authUiState.emailLoading = true;
        authUiState.errorMsg = '';
        renderApp();
        try {
          if (window.ViralBoostFirebaseReady) await window.ViralBoostFirebaseReady;
          if (isEmailSignup) {
            fbUser = await window.ViralBoostFirebase.signUpWithEmail(contact, a.password, name);
          } else {
            fbUser = await window.ViralBoostFirebase.signInWithEmail(contact, a.password);
          }
        } catch (emailErr) {
          const msg = String(emailErr?.message || emailErr || 'Email authentication failed.');
          authUiState.emailLoading = false;
          authUiState.errorMsg = msg;
          renderApp();
          showToast(`⚠️ Email Auth Failed: ${msg}`, 'error');
          return;
        }
        authUiState.emailLoading = false;
      }

      const ts = new Date().toISOString();
      const resolvedName = name || fbUser?.displayName || contact.split('@')[0] || 'Creator';
      state.profile.username = resolvedName;
      state.profile.userContact = isMobile ? (a.e164 || contact) : contact;
      if (!isMobile || contact.includes('@')) state.profile.email = contact;
      else if (fbUser?.email || cloudUser?.email) state.profile.email = fbUser?.email || cloudUser.email;
      state.profile.authMethod = isMobile ? 'mobile_otp' : 'email_password';
      state.profile.isLoggedIn = true;
      state.profile.hasAgreedToTerms = true;
      state.profile.legalAccepted = true;
      state.profile.legalAgreementTimestamp = ts;
      state.profile.welcomeClaimed = true;
      state.legalAuditLogs.unshift({
        name: resolvedName,
        contact: state.profile.userContact,
        method: state.profile.authMethod,
        timestamp: ts,
        status: 'AGREED_AND_VERIFIED'
      });

      saveState();
      syncProfileToCloud();
      renderApp();
      showToast('🟢 Firebase Account Verified & Synced to Cloud Firestore!', 'success');
    }

    function logoutViralBoostAccount() {
      stopBeatSynth();
      if (typeof stopStudioVoiceover === 'function') stopStudioVoiceover();
      if (studioMediaCache.veoVideoUrl) {
        try { URL.revokeObjectURL(studioMediaCache.veoVideoUrl); } catch (_) {}
      }
      studioMediaCache.uploadedPhotoDataUrl = '';
      studioMediaCache.uploadedPhotoBase64 = '';
      studioMediaCache.uploadedPhotoName = '';
      studioMediaCache.sceneDataUrls = [];
      studioMediaCache.loadedSceneImgs = [];
      studioMediaCache.veoVideoUrl = '';
      studioMediaCache.veoMimeType = '';

      const fresh = defaultState();
      state.profile = fresh.profile;
      state.channels = emptyChannelsState();
      state.transactions = [];
      state.payments = [];
      state.tickets = [];
      activeOverlay = null;
      const overlayHost = document.getElementById('overlay-host');
      if (overlayHost) overlayHost.classList.add('hidden');
      closeModal();
      authUiState.otp = '';
      authUiState.password = '';
      authUiState.otpSent = false;
      authUiState.agreed = false;
      authUiState.pendingGoogleSignup = false;
      authUiState.errorMsg = '';
      saveState();
      if (window.ViralBoostFirebase && window.ViralBoostFirebase.currentUser && window.ViralBoostFirebase.signOutGoogle) {
        window.ViralBoostFirebase.signOutGoogle();
      }
      renderApp();
      showToast('🚪 Signed out. Please sign in to continue.', 'info');
    }

    function renderApp() {
      applyTheme();
      const modalHostEl = document.getElementById('modal-host');
      if (!activeOverlay && (!modalHostEl || modalHostEl.classList.contains('hidden'))) {
        document.body.style.overflow = '';
      }
      const gate = document.getElementById('auth-gate');
      const appShell = document.getElementById('app');
      if (!isUserAuthenticated()) {
        if (appShell) appShell.classList.add('hidden');
        if (gate) {
          gate.classList.remove('hidden');
          gate.innerHTML = renderSecureSignupScreen();
        }
        return;
      }
      if (gate) gate.classList.add('hidden');
      if (appShell) appShell.classList.remove('hidden');

      syncHeader();
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = `nav-btn flex flex-col items-center justify-center py-1 rounded-xl transition min-h-[48px] ${
          isActive ? 'bg-violet-600/25 text-cyan-300 border border-violet-500/40' : 'text-slate-400 hover:text-slate-200'
        }`;
      });
      const main = document.getElementById('main-content');
      switch (state.activeTab) {
        case 'home': main.innerHTML = renderHomeTab(); break;
        case 'ai': main.innerHTML = renderAiTab(); break;
        case 'vip': main.innerHTML = renderVipTab(); break;
        case 'ranks': main.innerHTML = renderRanksTab(); break;
        case 'support': main.innerHTML = renderSupportTab(); break;
        case 'profile': main.innerHTML = renderProfileTab(); break;
      }
    }

    // -------------------------------------------------------------------------

      const p = state.profile;

      const connectedCount = SOCIAL_CHANNELS.filter(c => state.channels[c.id]?.connected && (state.channels[c.id]?.handle || '').trim()).length;
      const cp = state.crossPoster;
      const displayName = (p.username || cloudUser?.displayName || cloudUser?.email || 'Creator').trim();

      return `
        <!-- #1 HERO TOP: One-Click to Share Video Multi-Platform (Front & Center) -->
        <section class="rounded-2xl p-4 bg-gradient-to-br from-[#171236] via-[#130D2E] to-[#0B152B] border-2 border-cyan-400/70 shadow-xl shadow-violet-900/30 glow-pulse">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-gradient-to-r from-pink-500 to-amber-500 text-white text-[9.5px] font-extrabold tracking-wide">⚡ #1 CREATOR ENGINE</span>
              <h2 class="font-display font-extrabold text-lg leading-tight mt-1.5 text-white">One-Click to Share Video Multi-Platform</h2>

          </div>

          <!-- 6 Social Channels Quick Selector (All Start Disconnected Until User Connects) -->

    // =========================================================================
    // 6. FULL-SCREEN OVERLAY STUDIOS (100% INTERACTIVE)

    function renderOverlay() {
      const body = document.getElementById('overlay-body');
      switch (activeOverlay) {
        case 'oneClickAiStudio': body.innerHTML = renderOneClickAiStudioOverlay(); startReelCanvasLoop(); break;
        case 'diamondDashboard': body.innerHTML = renderDiamondDashboardOverlay(); break;
        case 'reelsHub': body.innerHTML = renderReelsHubOverlay(); break;
        case 'shopsyMall': body.innerHTML = renderShopsyMallOverlay(); break;
        case 'affiliateHub': body.innerHTML = renderAffiliateHubOverlay(); break;
        case 'creatorPool': body.innerHTML = renderCreatorPoolOverlay(); break;
        case 'geminiStudio': body.innerHTML = renderGeminiStudioOverlay(); break;
        case 'crossPoster': body.innerHTML = renderCrossPosterOverlay(); break;
        case 'adminPanel':
          body.innerHTML = renderAdminPanelOverlay();
          if (!adminUsersState.loadedOnce && !adminUsersState.loading) {
            setTimeout(() => refreshAdminUsers(true), 50);
          }
          break;
      }
    }

    function overlayHeader(title, subtitle, rightBadge = '') {
      return `
        <div class="sticky top-0 z-20 w-full max-w-full bg-[#0E0C24]/95 backdrop-blur-md border-b border-slate-800 px-3 sm:px-3.5 py-3 flex items-center justify-between gap-2 overflow-hidden">

            <div class="min-w-0 flex-1">
              <h2 class="font-display font-extrabold text-sm sm:text-base text-white truncate">${title}</h2>
              <p class="text-[10.5px] text-cyan-400 font-semibold truncate">${subtitle}</p>
            </div>
          </div>
          ${rightBadge ? `<div class="shrink-0">${rightBadge}</div>` : `<button onclick="closeOverlay()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-xs font-bold text-slate-300 shrink-0">Home 🏠</button>`}
        </div>`;
    }

    function getActiveStudioCategory() {
      const idx = Math.min(AI_VIDEO_CATEGORIES.length - 1, Math.max(0, Number(state.aiStudioState.catIdx) || 0));
      if (state.aiStudioState.catIdx !== idx) state.aiStudioState.catIdx = idx;
      return AI_VIDEO_CATEGORIES[idx];
    }

    function getActiveStudioBeat() {
      const cat = getActiveStudioCategory();
      const bIdx = Math.min(STUDIO_BEATS.length - 1, Math.max(0, Number(state.aiStudioState.selectedBeatIdx) || 0));
      const beat = STUDIO_BEATS[bIdx] || STUDIO_BEATS[0];
      return {
        idx: bIdx,
        name: beat.bpm ? beat.name : cat.beatTrackName,
        bpm: beat.bpm || cat.bpm || 128
      };
    }

    // -------------------------------------------------------------------------
    // OVERLAY 1: 1-CLICK AI VIDEO & VIRAL HASHTAG STUDIO (PRO CREATOR DASHBOARD)
    // -------------------------------------------------------------------------
    function renderOneClickAiStudioOverlay() {
      const s = state.aiStudioState;
      const mode = ['prompt', 'photo', 'script'].includes(s.studioMode) ? s.studioMode : 'prompt';
      const cat = getActiveStudioCategory();
      const activeBeat = getActiveStudioBeat();
      const scenes = Array.isArray(s.scenes) ? s.scenes : [];
      const hasResult = Boolean((s.title || '').trim() || (s.script || '').trim() || scenes.length > 0);
      const step = isStudioGenerating ? (Number(s.progressStep) || 1) : (s.progressStep === 3 || hasResult ? 3 : 0);
      const hasPhoto = Boolean(studioMediaCache.uploadedPhotoDataUrl || s.coverDataUrl);
      const photoPreviewSrc = studioMediaCache.uploadedPhotoDataUrl || s.coverDataUrl || '';

      const stepBadge = (num, label) => {
        const done = step > num || (!isStudioGenerating && step === 3 && num === 3);
        const active = isStudioGenerating && step === num;
        const cls = done
          ? 'bg-emerald-500/20 border-emerald-400/60 text-emerald-300'
          : active
            ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200 animate-pulse'
            : 'bg-slate-900/70 border-slate-800 text-slate-400';
        const prefix = done ? '✓' : active ? '⏳' : '';
        return `<div class="flex-1 min-w-[100px] sm:min-w-0 flex items-center justify-center gap-1 px-2 py-1.5 rounded-xl border text-[10px] sm:text-[10.5px] font-bold transition overflow-hidden ${cls}">${prefix ? `<span class="shrink-0">${prefix}</span>` : ''}<span class="truncate">${num}. ${label}</span></div>`;
      };

      const modeTab = (id, emoji, label, sub) => {
        const active = mode === id;

        ? '🎬 Google Veo AI Video'

      return `
        ${overlayHeader('1-Click AI Video & Viral Hashtags', 'Flow / Veo AI Studio • Prompt, Photo & Script • 1080×1920 @ 30FPS', `<span class="px-2 py-1 rounded-lg bg-gradient-to-r from-amber-400/20 to-cyan-400/20 border border-amber-400/60 text-amber-300 text-[9.5px] font-extrabold whitespace-nowrap">${state.profile.isVip ? '👑 VIP HD' : '⚡ VEO PRO'}</span>`)}

              ${modeTab('photo', '📸', 'Photo to Video', '3D + Vision')}

            <!-- Category Pills (Comedy, Motivation, Story, Shayari, Tech, Facts, Rap, Gaming) -->
            <div class="flex flex-wrap gap-1.5 sm:gap-2 w-full min-w-0">
              ${AI_VIDEO_CATEGORIES.map((c, idx) => `

            <!-- Mode-Specific Input Workspace -->
            ${mode === 'photo' ? `

                  <div class="text-[11px] font-extrabold text-cyan-300">📸 Upload Your Photo for Gemini Vision + 3D AI Animation</div>
                  ${hasPhoto ? `<button type="button" onclick="clearStudioUploadedPhoto()" class="px-2.5 py-1 rounded-lg bg-red-950/70 border border-red-500/40 text-red-300 text-[10px] font-bold">✕ Clear Photo</button>` : ''}

                <div class="flex items-center gap-3 flex-wrap sm:flex-nowrap">

    // =========================================================================
    // 7. INTERACTIVE ACTIONS, FLOW/VEO MOTION COMPOSITOR & HINDI VOICE + SCORE
    // =========================================================================
    function easeInOutQuad(x) {
      return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    function drawCoverKenBurns(ctx, img, w, h, progress, motionType, alpha = 1) {
      if (!img || !(img.naturalWidth > 0 || img.width > 0) || alpha <= 0.01) return;
      const iw = img.naturalWidth || img.width || w;
      const ih = img.naturalHeight || img.height || h;
      const baseScale = Math.max(w / iw, h / ih);
      const p = easeInOutQuad(Math.min(1, Math.max(0, progress)));

      let zoom = 1.08;
      let shiftX = 0;
      let shiftY = 0;
      const motion = String(motionType || '').toLowerCase();
      if (motion.includes('out')) {
        zoom = 1.16 - 0.11 * p;
        shiftY = (0.5 - p) * 14;
      } else if (motion.includes('right')) {
        zoom = 1.13;
        shiftX = (p - 0.5) * 28;
      } else if (motion.includes('left')) {
        zoom = 1.13;
        shiftX = (0.5 - p) * 28;
      } else {
        zoom = 1.03 + 0.12 * p;
        shiftY = (p - 0.5) * -10;
      }

      const dw = iw * baseScale * zoom;
      const dh = ih * baseScale * zoom;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.drawImage(img, (w - dw) / 2 + shiftX, (h - dh) / 2 + shiftY, dw, dh);
      ctx.restore();
    }

    function drawProceduralCinemaScene(ctx, w, h, elapsedSec, cat, sceneIdx, alpha = 1) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      const palettes = [
        ['#0B1026', '#1E293B', '#F59E0B'],
        ['#091428', '#172554', '#06B6D4'],
        ['#180C24', '#3B0764', '#EC4899'],
        ['#071A1E', '#0F172A', '#10B981']
      ];
      const pal = palettes[sceneIdx % palettes.length];
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, pal[0]);
      bg.addColorStop(0.52, pal[1]);
      bg.addColorStop(1, '#04050C');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Volumetric cinematic rim lights & shallow depth-of-field bokeh
      const drift = Math.sin(elapsedSec * 0.8 + sceneIdx) * 18;
      const orb1 = ctx.createRadialGradient(w * 0.28 + drift, h * 0.28, 12, w * 0.28 + drift, h * 0.28, w * 0.65);
      orb1.addColorStop(0, (cat.accent || pal[2]) + '66');
      orb1.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = orb1;
      ctx.fillRect(0, 0, w, h);

      const orb2 = ctx.createRadialGradient(w * 0.78 - drift, h * 0.62, 10, w * 0.78 - drift, h * 0.62, w * 0.6);
      orb2.addColorStop(0, (cat.secondary || '#7C3AED') + '55');
      orb2.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = orb2;
      ctx.fillRect(0, 0, w, h);

      // Soft cinema bokeh discs
      for (let i = 0; i < 10; i++) {
        const bx = ((i * 83 + sceneIdx * 47) % (w - 40)) + 20 + Math.sin(elapsedSec * 0.6 + i) * 8;
        const by = ((i * 119 + sceneIdx * 61) % (h * 0.78)) + 30 + Math.cos(elapsedSec * 0.5 + i) * 6;
        const br = 8 + (i % 4) * 9;
        ctx.beginPath();
        ctx.fillStyle = i % 2 === 0 ? (cat.accent || '#00E5FF') : '#FFFFFF';
        ctx.globalAlpha = alpha * (0.04 + (i % 3) * 0.025);
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Pure deterministic 9:16 4-Scene Flow/Veo Motion Compositor (360x640 preview & 1080x1920 HD export)
    function drawReelFrame(ctx, canvasWidth, canvasHeight, elapsedSec, opts = {}) {
      const cat = opts.cat || AI_VIDEO_CATEGORIES[state.aiStudioState.catIdx] || AI_VIDEO_CATEGORIES[0];
      const title = opts.title != null ? opts.title : (state.aiStudioState.title || `${cat.titleHindi} • Flow / Veo Studio`);
      const scenes = Array.isArray(opts.scenes) && opts.scenes.length ? opts.scenes : (Array.isArray(state.aiStudioState.scenes) ? state.aiStudioState.scenes : []);
      const sceneImgs = Array.isArray(opts.sceneImgs) ? opts.sceneImgs : [];
      const coverImg = opts.coverImg || null;
      const isVip = opts.isVip != null ? opts.isVip : Boolean(state.profile.isVip);

      const w = 360;
      const h = 640;
      const sceneDuration = 3.0;
      const totalScenes = Math.max(1, scenes.length || 4);
      const totalLoop = sceneDuration * totalScenes;
      const safeTime = Math.max(0, Number(elapsedSec) || 0) % totalLoop;
      const sceneIdx = Math.floor(safeTime / sceneDuration) % totalScenes;
      const prevIdx = (sceneIdx - 1 + totalScenes) % totalScenes;
      const localSec = safeTime - sceneIdx * sceneDuration;
      const progress = Math.min(1, Math.max(0, localSec / sceneDuration));
      const fadeDur = 0.45;
      const fadeAlpha = localSec < fadeDur ? (localSec / fadeDur) : 1;

      const pickImg = (idx) => {
        const sImg = sceneImgs[idx];
        if (sImg && (sImg.naturalWidth > 0 || sImg.width > 0)) return sImg;
        const firstLoaded = sceneImgs.find(im => im && (im.naturalWidth > 0 || im.width > 0));
        if (firstLoaded) return firstLoaded;
        return (coverImg && (coverImg.naturalWidth > 0 || coverImg.width > 0)) ? coverImg : null;
      };

      const curScene = scenes[sceneIdx] || {};
      const prevScene = scenes[prevIdx] || {};
      const curImg = pickImg(sceneIdx);
      const prevImg = pickImg(prevIdx);

      ctx.save();
      ctx.setTransform(canvasWidth / w, 0, 0, canvasHeight / h, 0, 0);

      // Base background
      ctx.fillStyle = '#05060D';
      ctx.fillRect(0, 0, w, h);

      // Draw previous scene during crossfade, then active scene with Ken Burns 3D camera motion
      if (fadeAlpha < 1 && totalScenes > 1) {
        if (prevImg) {
          drawCoverKenBurns(ctx, prevImg, w, h, 0.92 + localSec * 0.08, prevScene.cameraMotion || 'zoom-in', 1);
        } else {
          drawProceduralCinemaScene(ctx, w, h, elapsedSec, cat, prevIdx, 1);
        }
      }

      if (curImg) {
        drawCoverKenBurns(ctx, curImg, w, h, progress, curScene.cameraMotion || (sceneIdx % 2 === 0 ? 'zoom-in' : 'pan-right'), fadeAlpha);
      } else {
        drawProceduralCinemaScene(ctx, w, h, elapsedSec, cat, sceneIdx, fadeAlpha);
      }

      // Floating warm/cool ambient dust particles for cinema depth
      for (let p = 0; p < 14; p++) {
        const px = ((p * 57 + elapsedSec * (10 + (p % 4) * 4)) % (w + 20)) - 10;
        const py = ((p * 91 - elapsedSec * (8 + (p % 3) * 3)) % h + h) % h;
        const pr = 1.1 + (p % 3) * 0.7;
        ctx.beginPath();
        ctx.fillStyle = p % 2 === 0 ? 'rgba(255,255,255,0.22)' : (cat.accent || '#00E5FF');
        ctx.globalAlpha = 0.25;
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Top & bottom cinema vignette for crisp Reel caption legibility
      const topVig = ctx.createLinearGradient(0, 0, 0, h * 0.24);
      topVig.addColorStop(0, 'rgba(4, 6, 14, 0.72)');
      topVig.addColorStop(1, 'rgba(4, 6, 14, 0)');
      ctx.fillStyle = topVig;
      ctx.fillRect(0, 0, w, h * 0.24);

      const botVig = ctx.createLinearGradient(0, h * 0.56, 0, h);
      botVig.addColorStop(0, 'rgba(4, 6, 14, 0)');
      botVig.addColorStop(0.55, 'rgba(4, 6, 14, 0.74)');
      botVig.addColorStop(1, 'rgba(4, 6, 14, 0.94)');
      ctx.fillStyle = botVig;
      ctx.fillRect(0, h * 0.56, w, h * 0.44);

      // 4-Segment Reels Story/Scene Progress Bar along very top
      const segGap = 5;
      const segW = (w - 28 - segGap * (totalScenes - 1)) / totalScenes;
      for (let sIdx = 0; sIdx < totalScenes; sIdx++) {
        const sx = 14 + sIdx * (segW + segGap);
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fillRect(sx, 10, segW, 3);
        const fillRatio = sIdx < sceneIdx ? 1 : sIdx === sceneIdx ? progress : 0;
        if (fillRatio > 0) {
          ctx.fillStyle = cat.accent || '#00E5FF';
          ctx.fillRect(sx, 10, segW * fillRatio, 3);
        }
      }

      // Dynamic Reel Caption synced to active scene (or hook title)
      const activeCaption = String(curScene.caption || title || `${cat.titleHindi} • Flow / Veo Studio`).trim();
      const capY = h * 0.74;
      const popScale = localSec < 0.22 ? (0.94 + (localSec / 0.22) * 0.06) : 1;

      ctx.save();
      ctx.translate(w / 2, capY);
      ctx.scale(popScale, popScale);

      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(-(w - 36) / 2, -32, w - 36, 78, 16);
      } else {
        ctx.rect(-(w - 36) / 2, -32, w - 36, 78);
      }
      ctx.fill();

      // Minimal subtle bottom waveform accent
      const bars = 20;

      for (let b = 0; b < bars; b++) {
        const bh = 4 + Math.abs(Math.sin(elapsedSec * 7 + b * 0.7)) * 14;
        ctx.fillStyle = b % 2 === 0 ? 'rgba(0, 229, 255, 0.55)' : (cat.accent || '#A855F7');
        ctx.fillRect(45 + b * bw + 1.5, h - 78 - bh / 2, bw - 3, bh);

        ctx.font = 'bold 10px monospace';

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text || '').split(' ');
      let line = '';
      let cy = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, cy);
          line = words[n] + ' ';
          cy += lineHeight;
          if (cy > y + lineHeight * 2.2) break;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, cy);
    }

    function playCategoryScoreStep(ctx, destNode, catId, step) {
      if (!ctx) return;
      const now = ctx.currentTime;
      const id = String(catId || '').toLowerCase();
      const chords = {
        story: [261.63, 329.63, 392.0, 493.88],
        shayari: [220.0, 261.63, 329.63, 392.0],
        comedy: [392.0, 440.0, 523.25, 659.25],
        motivation: [196.0, 246.94, 293.66, 392.0],
        tech: [146.83, 220.0, 293.66, 349.23],
        facts: [246.94, 293.66, 369.99, 440.0],
        rap: [110.0, 130.81, 164.81, 196.0],
        gaming: [130.81, 196.0, 261.63, 311.13]
      };
      let scale = chords.motivation;
      let wave = 'triangle';
      let dur = 0.36;
      if (id.includes('story')) { scale = chords.story; wave = 'sine'; dur = 0.55; }
      else if (id.includes('shayari')) { scale = chords.shayari; wave = 'sine'; dur = 0.6; }
      else if (id.includes('comedy')) { scale = chords.comedy; wave = 'triangle'; dur = 0.24; }
      else if (id.includes('tech')) { scale = chords.tech; wave = 'sawtooth'; dur = 0.28; }
      else if (id.includes('fact')) { scale = chords.facts; wave = 'sine'; dur = 0.38; }
      else if (id.includes('rap')) { scale = chords.rap; wave = 'triangle'; dur = 0.26; }
      else if (id.includes('gaming')) { scale = chords.gaming; wave = 'sawtooth'; dur = 0.24; }

      const freq = scale[step % scale.length];
      const osc = ctx.createOscillator();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, now);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(wave === 'sawtooth' ? 950 : 1400, now);

      // Subtle cinematic background volume (0.18 max per user spec)
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(filter);
      filter.connect(gain);
      if (destNode) gain.connect(destNode);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function selectBestHindiVoice(gender = 'female') {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const g = gender === 'male' ? 'male' : 'female';
      const femaleHints = /female|lekha|swara|neerja|heera|kalpana|priya|aditi|raveena|kanya|neural.*f|woman/i;
      const maleHints = /male|hemant|madhur|prabhat|rishi|arjun|kabir|neural.*m|\bman\b/i;

      const scored = voices.map((v) => {
        let score = 0;
        const lang = String(v.lang || '').toLowerCase();
        const name = String(v.name || '').toLowerCase();
        if (lang.startsWith('hi')) score += 60;
        else if (lang.endsWith('-in')) score += 35;
        if (name.includes('google') || name.includes('microsoft') || name.includes('natural')) score += 15;
        if (g === 'female') {
          if (femaleHints.test(name)) score += 25;
          if (maleHints.test(name)) score -= 20;
        } else {
          if (maleHints.test(name)) score += 25;
          if (femaleHints.test(name)) score -= 20;
        }
        return { v, score };
      });
      scored.sort((a, b) => b.score - a.score);
      return scored[0]?.v || null;
    }

    function speakStudioVoiceover(customText = '') {
      if (!('speechSynthesis' in window)) {
        showToast('Voiceover synthesis not supported on this browser.', 'info');
        return;
      }
      const s = state.aiStudioState;
      const rawText = String(customText || s.voiceoverText || s.script || s.title || '').trim();
      const spoken = rawText
        .replace(/\[[^\]]+\]/g, ' ')
        .replace(/https?:\/\/\S+/g, ' ')
        .replace(/🛍️.*$/gm, '')
        .replace(/[#*_`]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 650);
      if (!spoken) {
        showToast('Generate a script first to preview Hindi AI Voiceover!', 'info');
        return;
      }
      stopStudioVoiceover();
      try {
        const utt = new SpeechSynthesisUtterance(spoken);
        utt.lang = 'hi-IN';
        const gender = s.voiceGender === 'male' ? 'male' : 'female';
        const chosenVoice = selectBestHindiVoice(gender);
        if (chosenVoice) utt.voice = chosenVoice;
        utt.rate = 1.02;
        utt.pitch = gender === 'male' ? 0.92 : 1.08;
        utt.volume = 1.0;
        utt.onstart = () => {
          isVoiceSpeaking = true;
          if (activeOverlay === 'oneClickAiStudio') renderOverlay();
        };
        utt.onend = () => {
          isVoiceSpeaking = false;
          if (activeOverlay === 'oneClickAiStudio') renderOverlay();
        };
        utt.onerror = () => {
          isVoiceSpeaking = false;
          if (activeOverlay === 'oneClickAiStudio') renderOverlay();
        };
        isVoiceSpeaking = true;
        window.speechSynthesis.speak(utt);
        if (activeOverlay === 'oneClickAiStudio') renderOverlay();
      } catch (e) {
        isVoiceSpeaking = false;
      }
    }

    async function callGeminiBackend({ prompt, platform = 'Instagram Reels & YouTube Shorts', tone = 'High-Energy Viral (Hinglish)', contentType = 'REEL_KIT', expectJson = true, history = [] }) {
      const cleanPrompt = String(prompt || '').trim();
      let lastErrorMsg = '';

      // Wait briefly for ES Module Firebase SDK initialization on very first click
      if (window.ViralBoostFirebaseReady) {
        try { await Promise.race([window.ViralBoostFirebaseReady, new Promise(r => setTimeout(r, 3500))]); } catch (_) {}
      }

      // 1) Primary Production Engine: Official Firebase AI Logic Web SDK (App Check + resilient direct fallback)
      if (window.ViralBoostFirebase && window.ViralBoostFirebase.aiReady) {
        try {
          const fbRes = await window.ViralBoostFirebase.generateContent({ prompt: cleanPrompt, platform, tone, contentType, expectJson, history });
          if (fbRes && fbRes.ok && fbRes.data) {
            return fbRes;
          }
        } catch (fbErr) {
          lastErrorMsg = String(fbErr?.message || fbErr || 'Firebase AI Logic request failed');
        }
      } else {
        lastErrorMsg = window.ViralBoostFirebase?.lastAiError || 'Firebase AI Logic Web SDK did not initialize.';
      }

      // 2) Secondary Engine: Serverless Proxy (/api/gemini on Vercel/Node if hosted outside GitHub Pages)
      const proxyEndpoint = resolveGeminiProxyEndpoint();
      if (proxyEndpoint) {
        try {
          const resp = await fetch(proxyEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: cleanPrompt, platform, tone, contentType, expectJson, history })
          });
          if (resp.ok) {
            const payload = await resp.json();
            if (payload && payload.ok && payload.data) {
              return { ok: true, source: 'LIVE_GEMINI', data: payload.data };
            }
          }
        } catch (proxyErr) {
          lastErrorMsg = String(proxyErr?.message || lastErrorMsg);
        }
      }

      // 3) Optional Local Key Fallback (only if explicitly entered by developer for offline file:// testing)
      const userKey = (localStorage.getItem(GEMINI_KEY_STORAGE) || '').trim();
      if (userKey) {
        const sysText = 'You are ViralBoost AI, an expert bilingual (Hindi + Hinglish + English) short-form video strategist and social growth engineer for Indian creators.';
        const promptBody = expectJson
          ? `Mode: ${contentType}\nPlatform: ${platform}\nTone: ${tone}\nTopic: ${cleanPrompt}\nReturn ONLY valid JSON with keys: {"title":"...","hook":"...","script":"[0-3s HOOK] ...\\n[3-20s BODY] ...\\n[20-30s CTA] ...","cta":"...","hashtags":"#... #...","tips":["..."]}`
          : cleanPrompt;
        const contents = history.slice(-6).map(m => ({
          role: m.sender === 'USER' ? 'user' : 'model',
          parts: [{ text: String(m.text || '').slice(0, 1200) }]
        }));
        contents.push({ role: 'user', parts: [{ text: promptBody }] });

        const cfg = { temperature: 0.85, topP: 0.95, maxOutputTokens: 1200 };
        if (expectJson) cfg.responseMimeType = 'application/json';

        let r = null;
        let raw = null;
        const keyModels = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];
        for (const mName of keyModels) {
          try {
            r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mName}:generateContent?key=${encodeURIComponent(userKey)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: sysText }] },
                contents,
                generationConfig: cfg
              })
            });
            raw = await r.json();
            if (r.ok && raw?.candidates?.[0]?.content?.parts?.[0]?.text) break;
          } catch (_) {}
        }
        if (!r || !r.ok) {
          throw new Error(raw?.error?.message || 'Gemini API Key Error');
        }
        const txt = raw?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (txt) {
          if (!expectJson) {
            return { ok: true, source: 'LIVE_GEMINI', data: { rawText: txt } };
          }
          let parsed;
          try {
            parsed = JSON.parse(txt.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim());
          } catch (_) {
            parsed = { title: `🔥 ${cleanPrompt}`, hook: txt.split('\n')[0] || '', script: txt, cta: 'Share & Comment 🔥', hashtags: '#ViralReels #TrendingShorts #ViralBoostAI' };
          }
          return {
            ok: true,
            source: 'LIVE_GEMINI',

              title: String(parsed.title || `🔥 ${cleanPrompt}`),
              hook: String(parsed.hook || ''),

              cta: String(parsed.cta || ''),
              hashtags: String(parsed.hashtags || '#ViralReels #TrendingShorts #ViralBoostAI'),
              tips: Array.isArray(parsed.tips) ? parsed.tips : [],
              rawText: txt
            }
          };
        }
      }

      // Strictly NO offline/demo fallback for general text routes — surface actual live AI error
      throw new Error(lastErrorMsg || 'Live Gemini AI service unavailable. Check internet connection & App Check.');
    }

    function preloadStudioCoverForExport(srcUrl) {
      return new Promise((resolve) => {
        if (!srcUrl) { resolve(null); return; }
        const img = new Image();
        let settled = false;
        const finish = (val) => {
          if (settled) return;
          settled = true;
          resolve(val);
        };
        const timer = setTimeout(() => finish(img.complete && img.naturalWidth > 0 ? img : null), 3000);
        img.onload = async () => {
          clearTimeout(timer);
          try { if (typeof img.decode === 'function') await img.decode(); } catch (_) {}
          finish(img);
        };
        img.onerror = () => { clearTimeout(timer); finish(null); };
        if (/^https?:\/\//i.test(srcUrl)) img.crossOrigin = 'anonymous';
        img.src = srcUrl;
      });
    }

    function createPrecision30FpsTicker(onTick) {
      const intervalMs = 1000 / 30;
      const workerCode = `
        let timerId = null;
        self.onmessage = function(e) {
          if (e.data === 'start') {
            if (timerId !== null) clearInterval(timerId);
            timerId = setInterval(function() { self.postMessage('tick'); }, ${intervalMs.toFixed(4)});
          } else if (e.data === 'stop') {
            if (timerId !== null) clearInterval(timerId);
            timerId = null;
          }
        };
      `;
      let worker = null;
      let workerBlobUrl = '';
      let fallbackTimer = null;
      try {
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        workerBlobUrl = URL.createObjectURL(blob);
        worker = new Worker(workerBlobUrl);
        worker.onmessage = () => onTick();
        worker.postMessage('start');
      } catch (_) {
        worker = null;
        fallbackTimer = setInterval(onTick, intervalMs);
      }
      return {
        stop() {
          if (worker) {
            try { worker.postMessage('stop'); } catch (_) {}
            try { worker.terminate(); } catch (_) {}
            worker = null;
          }
          if (workerBlobUrl) {
            try { URL.revokeObjectURL(workerBlobUrl); } catch (_) {}
            workerBlobUrl = '';
          }
          if (fallbackTimer !== null) {
            clearInterval(fallbackTimer);
            fallbackTimer = null;
          }
        }
      };
    }

    async function exportOneClickReelVideo() {
      if (typeof MediaRecorder === 'undefined') {
        showToast('Your browser does not support in-browser video recording.', 'error');
        return;
      }
      if (isExportingVideo) return;

      const TARGET_FPS = 30;
      const DURATION_MS = 12000;
      const TOTAL_FRAMES = 360;
      const EXPORT_W = 1080;
      const EXPORT_H = 1920;

      isExportingVideo = true;
      exportProgressPct = 2;
      exportedReelStats = null;
      state.aiStudioState.isPlaying = true;
      updateExportButtonDom(`🎬 Preparing 12s 1080×1920 @ 30 FPS...`, true);

      // Dedicated hidden 1080x1920 9:16 Full HD export canvas (isolated from DOM overlay re-renders)
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = EXPORT_W;
      exportCanvas.height = EXPORT_H;
      exportCanvas.setAttribute('aria-hidden', 'true');
      exportCanvas.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:0.001;pointer-events:none;';
      if (typeof exportCanvas.captureStream !== 'function') {
        isExportingVideo = false;
        updateExportButtonDom('⬇️ Render & Download 9:16 HD Video (30FPS)', false);
        showToast('Your browser does not support canvas video stream capture.', 'error');
        return;
      }
      document.body.appendChild(exportCanvas);
      const exportCtx = exportCanvas.getContext('2d', { alpha: false });

      let beatInterval = null;
      let keepAliveOsc = null;
      let keepAliveGain = null;
      let ticker = null;
      let safetyTimer = null;
      let combinedStream = null;
      let recorder = null;
      let backgroundedDuringExport = document.hidden;

      const onVisibilityTrack = () => {
        if (document.hidden) backgroundedDuringExport = true;
      };
      document.addEventListener('visibilitychange', onVisibilityTrack);

      const cleanupResources = () => {
        document.removeEventListener('visibilitychange', onVisibilityTrack);
        if (ticker) { ticker.stop(); ticker = null; }
        if (safetyTimer) { clearTimeout(safetyTimer); safetyTimer = null; }
        if (beatInterval) { clearInterval(beatInterval); beatInterval = null; }
        if (keepAliveOsc) { try { keepAliveOsc.stop(); } catch (_) {} try { keepAliveOsc.disconnect(); } catch (_) {} keepAliveOsc = null; }
        if (keepAliveGain) { try { keepAliveGain.disconnect(); } catch (_) {} keepAliveGain = null; }
        if (combinedStream) {
          try { combinedStream.getTracks().forEach(t => t.stop()); } catch (_) {}
          combinedStream = null;
        }
        if (exportCanvas.parentNode) {
          try { exportCanvas.parentNode.removeChild(exportCanvas); } catch (_) {}
        }
      };

      try {
        const cat = getActiveStudioCategory();
        const activeBeat = getActiveStudioBeat();
        const sceneUrls = Array.isArray(studioMediaCache.sceneDataUrls) && studioMediaCache.sceneDataUrls.length
          ? studioMediaCache.sceneDataUrls
          : [studioMediaCache.uploadedPhotoDataUrl || state.aiStudioState.coverDataUrl].filter(Boolean);
        const preloadedSceneImgs = await Promise.all(sceneUrls.map(u => preloadStudioCoverForExport(u)));
        const snapshot = {
          cat,
          title: state.aiStudioState.title || `${cat.titleHindi} • Flow / Veo AI Reel`,
          scenes: Array.isArray(state.aiStudioState.scenes) ? state.aiStudioState.scenes : [],
          sceneImgs: preloadedSceneImgs,
          coverImg: preloadedSceneImgs[0] || await preloadStudioCoverForExport(studioMediaCache.uploadedPhotoDataUrl || state.aiStudioState.coverDataUrl),
          isVip: Boolean(state.profile.isVip)
        };

        // Render frame 0 before starting MediaRecorder
        drawReelFrame(exportCtx, EXPORT_W, EXPORT_H, 0, snapshot);

        // Capture locked 30FPS stream and explicitly trigger requestFrame() on Worker ticks when available
        const videoStream = exportCanvas.captureStream(TARGET_FPS);
        const videoTrack = videoStream.getVideoTracks()[0] || null;
        const tracks = [...videoStream.getVideoTracks()];

        // Route subtle 0.18-gain category background score + keep-alive carrier into MediaRecorder
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          const dest = audioCtx.createMediaStreamDestination();

          keepAliveOsc = audioCtx.createOscillator();
          keepAliveGain = audioCtx.createGain();
          keepAliveOsc.type = 'sine';
          keepAliveOsc.frequency.setValueAtTime(180, audioCtx.currentTime);
          keepAliveGain.gain.setValueAtTime(0.00005, audioCtx.currentTime);
          keepAliveOsc.connect(keepAliveGain);
          keepAliveGain.connect(dest);
          keepAliveGain.connect(audioCtx.destination);
          keepAliveOsc.start();

          let step = 0;
          const pulseMs = (60 / (activeBeat.bpm || 120)) * 1000;
          const triggerScore = () => {
            if (!isExportingVideo) return;
            playCategoryScoreStep(audioCtx, dest, cat.id, step);
            step++;
          };
          triggerScore();
          beatInterval = setInterval(triggerScore, pulseMs);
          tracks.push(...dest.stream.getAudioTracks());
        } catch (_) {}

        combinedStream = new MediaStream(tracks);
        const candidates = [
          { mime: 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', ext: 'mp4' },
          { mime: 'video/mp4', ext: 'mp4' },
          { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
          { mime: 'video/webm;codecs=vp8,opus', ext: 'webm' },
          { mime: 'video/webm', ext: 'webm' }
        ];
        const chosen = candidates.find(c => MediaRecorder.isTypeSupported(c.mime)) || { mime: '', ext: 'webm' };
        exportedReelExt = chosen.ext;

        try {
          recorder = chosen.mime
            ? new MediaRecorder(combinedStream, { mimeType: chosen.mime, videoBitsPerSecond: 5000000, audioBitsPerSecond: 128000 })
            : new MediaRecorder(combinedStream, { videoBitsPerSecond: 5000000, audioBitsPerSecond: 128000 });
        } catch (_) {
          recorder = chosen.mime ? new MediaRecorder(combinedStream, { mimeType: chosen.mime }) : new MediaRecorder(combinedStream);
        }

        const chunks = [];
        recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };

        let renderedFrames = 0;
        let stopInitiated = false;
        const startPerf = performance.now();

        const finalizeStop = () => {
          if (stopInitiated) return;
          stopInitiated = true;
          if (ticker) { ticker.stop(); ticker = null; }
          if (recorder && recorder.state !== 'inactive') {
            try { recorder.stop(); } catch (_) {}
          }
        };

        recorder.onstop = () => {
          const totalElapsedMs = Math.max(1000, performance.now() - startPerf);
          const effectiveFps = Math.min(TARGET_FPS, Math.round((renderedFrames / (totalElapsedMs / 1000)) * 10) / 10);
          cleanupResources();
          isExportingVideo = false;
          exportProgressPct = 100;
          exportStatusText = '';

          const finalMime = chosen.mime || 'video/webm';
          const blob = new Blob(chunks, { type: finalMime });
          exportedReelBlob = blob;
          if (exportedReelUrl) {
            try { URL.revokeObjectURL(exportedReelUrl); } catch (_) {}
          }
          exportedReelUrl = URL.createObjectURL(blob);
          exportedReelStats = {
            frames: renderedFrames,
            targetFps: TARGET_FPS,
            effectiveFps,
            resolution: `${EXPORT_W}×${EXPORT_H}`,
            backgroundSafe: backgroundedDuringExport
          };
          renderOverlay();
          showToast(`🎬 1080×1920 HD Video (${renderedFrames} frames @ ${effectiveFps} FPS) Ready!`, 'success');
          setTimeout(() => { UnityAdEngine.showInterstitial('post_export'); }, 600);
        };

        recorder.onerror = (ev) => {
          cleanupResources();
          isExportingVideo = false;
          exportStatusText = '';
          renderOverlay();
          showToast('Recording error: ' + (ev?.error?.message || 'MediaRecorder failed'), 'error');
        };

        recorder.start(250);

        if (videoTrack && typeof videoTrack.requestFrame === 'function') {
          try { videoTrack.requestFrame(); } catch (_) {}
        }
        renderedFrames = 1;

        // Inline Blob Web Worker (1000 / 30 ms) drives deterministic performance.now() rendering in foreground & background tabs
        ticker = createPrecision30FpsTicker(() => {
          if (!isExportingVideo || stopInitiated) return;
          const elapsedMs = performance.now() - startPerf;
          const expectedFrames = Math.min(TOTAL_FRAMES, Math.floor((elapsedMs / 1000) * TARGET_FPS) + 1);

          while (renderedFrames < expectedFrames && renderedFrames < TOTAL_FRAMES) {
            const frameTimeSec = renderedFrames / TARGET_FPS;
            drawReelFrame(exportCtx, EXPORT_W, EXPORT_H, frameTimeSec, snapshot);
            if (videoTrack && typeof videoTrack.requestFrame === 'function') {
              try { videoTrack.requestFrame(); } catch (_) {}
            }
            renderedFrames++;
          }

          const pct = Math.min(99, Math.round((renderedFrames / TOTAL_FRAMES) * 100));
          exportProgressPct = pct;
          if (renderedFrames % 5 === 0 || renderedFrames >= TOTAL_FRAMES) {
            updateExportButtonDom(`🎬 Rendering 1080×1920 @ 30 FPS (${pct}% • ${renderedFrames}/${TOTAL_FRAMES}f)`, true);
          }

          if (renderedFrames >= TOTAL_FRAMES && elapsedMs >= DURATION_MS - 34) {
            finalizeStop();
          }
        });

        safetyTimer = setTimeout(finalizeStop, DURATION_MS + 1500);
      } catch (e) {
        cleanupResources();
        isExportingVideo = false;
        exportStatusText = '';
        renderOverlay();
        showToast('Video export failed: ' + (e.message || 'Unknown error'), 'error');
      }
    }

    function handleStudioPhotoUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rawUrl = String(reader.result || '');
        const img = new Image();
        img.onload = () => {
          const maxW = 1080;
          const maxH = 1920;
          const scale = Math.min(1, maxW / img.width, maxH / img.height);
          const cw = Math.max(1, Math.round(img.width * scale));
          const ch = Math.max(1, Math.round(img.height * scale));
          const c = document.createElement('canvas');
          c.width = cw;
          c.height = ch;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, cw, ch);
          const compressed = c.toDataURL('image/jpeg', 0.88);
          const commaIdx = compressed.indexOf(',');
          studioMediaCache.uploadedPhotoDataUrl = compressed;
          studioMediaCache.uploadedPhotoMime = 'image/jpeg';
          studioMediaCache.uploadedPhotoBase64 = commaIdx >= 0 ? compressed.slice(commaIdx + 1) : '';
          studioMediaCache.uploadedPhotoName = file.name;
          studioMediaCache.sceneDataUrls = [compressed, compressed, compressed, compressed];
          studioMediaCache.veoVideoUrl = '';
          state.aiStudioState.coverDataUrl = compressed;
          state.aiStudioState.hasUserPhoto = true;
          state.aiStudioState.studioVersion = 2;
          saveState();
          renderOverlay();
          showToast('📸 Photo uploaded & synced to Gemini Vision + 3D Animator!', 'success');
        };
        img.onerror = () => {
          showToast('Could not decode selected photo.', 'error');
        };
        img.src = rawUrl;
      };
      reader.readAsDataURL(file);
    }

    function createCinematicPhotoSceneDataUrl(photoImg, sceneIdx, cat, scene = {}) {
      const c = document.createElement('canvas');
      c.width = 720;
      c.height = 1280;
      const ctx = c.getContext('2d');
      const accent = cat.accent || '#00E5FF';
      const secondary = cat.secondary || '#7C3AED';

      ctx.fillStyle = '#05060D';
      ctx.fillRect(0, 0, 720, 1280);

      if (photoImg && (photoImg.naturalWidth > 0 || photoImg.width > 0)) {
        const iw = photoImg.naturalWidth || photoImg.width;
        const ih = photoImg.naturalHeight || photoImg.height;
        const baseScale = Math.max(720 / iw, 1280 / ih);
        const crops = [
          { zoom: 1.04, ox: 0, oy: 0 },
          { zoom: 1.24, ox: -45, oy: -40 },
          { zoom: 1.18, ox: 45, oy: -15 },
          { zoom: 1.12, ox: 0, oy: 35 }
        ];
        const cr = crops[sceneIdx % crops.length];
        const dw = iw * baseScale * cr.zoom;
        const dh = ih * baseScale * cr.zoom;
        ctx.drawImage(photoImg, (720 - dw) / 2 + cr.ox, (1280 - dh) / 2 + cr.oy, dw, dh);
      }

      // Cinematic color grading & atmospheric rim light per scene
      const tints = [
        [accent + '33', 'rgba(255, 165, 60, 0.22)'],
        [secondary + '44', 'rgba(0, 229, 255, 0.24)'],
        ['rgba(236, 72, 153, 0.28)', 'rgba(15, 23, 42, 0.35)'],
        ['rgba(16, 185, 129, 0.26)', accent + '2E']
      ];
      const tint = tints[sceneIdx % tints.length];
      const grad = ctx.createLinearGradient(0, 0, 720, 1280);
      grad.addColorStop(0, tint[0]);
      grad.addColorStop(1, tint[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 720, 1280);

      // Subtle golden/neon flare on corner
      const flareX = sceneIdx % 2 === 0 ? 120 : 600;
      const flareY = sceneIdx < 2 ? 220 : 420;
      const flare = ctx.createRadialGradient(flareX, flareY, 10, flareX, flareY, 420);
      flare.addColorStop(0, accent + '4D');
      flare.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = flare;
      ctx.fillRect(0, 0, 720, 1280);

      return c.toDataURL('image/jpeg', 0.86);
    }

    function generatePhotorealisticSceneBackdropDataUrl(scene = {}, sceneIdx = 0, cat = null) {
      const c = document.createElement('canvas');
      c.width = 720;
      c.height = 1280;
      const ctx = c.getContext('2d');
      const activeCat = cat || getActiveStudioCategory();
      const accent = activeCat.accent || '#00E5FF';
      const secondary = activeCat.secondary || '#7C3AED';
      const id = String(activeCat.id || '').toLowerCase();

      // Rich photorealistic sky & environment palette matched to category + scene arc
      const moods = id.includes('shayari') || id.includes('story')
        ? [
            ['#1A0E2E', '#581C87', '#F97316'],
            ['#091428', '#1E3A8A', '#38BDF8'],
            ['#2A1120', '#831843', '#FB7185'],
            ['#0B1E24', '#0F766E', '#FBBF24']
          ]
        : id.includes('comedy')
          ? [
              ['#062822', '#0D9488', '#FDE047'],
              ['#1E1B4B', '#4F46E5', '#22D3EE'],
              ['#2B102E', '#BE185D', '#F59E0B'],
              ['#0C1E3A', '#0284C7', '#34D399']
            ]
          : [
              ['#090D1F', '#1E1B4B', accent],
              ['#0D1526', '#164E63', '#00E5FF'],
              ['#1F0B29', '#5B21B6', secondary],
              ['#0E1815', '#065F46', '#FBBF24']
            ];
      const pal = moods[sceneIdx % moods.length];

      const sky = ctx.createLinearGradient(0, 0, 0, 1280);
      sky.addColorStop(0, pal[0]);
      sky.addColorStop(0.55, pal[1]);
      sky.addColorStop(1, '#05060D');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 720, 1280);

      // Cinematic horizon sun / volumetric studio key-light
      const lightX = [520, 210, 480, 360][sceneIdx % 4];
      const lightY = [340, 460, 300, 380][sceneIdx % 4];
      const sun = ctx.createRadialGradient(lightX, lightY, 16, lightX, lightY, 520);
      sun.addColorStop(0, '#FFFFFFCC');
      sun.addColorStop(0.18, pal[2] + 'BB');
      sun.addColorStop(0.55, pal[2] + '33');
      sun.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, 720, 1280);

      // Soft angled volumetric light shafts
      ctx.save();
      ctx.globalAlpha = 0.14;
      for (let r = 0; r < 3; r++) {
        ctx.fillStyle = r % 2 === 0 ? '#FFFFFF' : pal[2];
        ctx.beginPath();
        ctx.moveTo(lightX - 30 + r * 20, lightY);
        ctx.lineTo(lightX - 320 + r * 140, 1280);
        ctx.lineTo(lightX - 180 + r * 150, 1280);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Cinematic distant layered hills / skyline silhouettes
      const horizonY = 780 + (sceneIdx % 2) * 35;
      ctx.fillStyle = 'rgba(10, 12, 24, 0.55)';
      ctx.beginPath();
      ctx.moveTo(0, 1280);
      ctx.lineTo(0, horizonY);
      ctx.quadraticCurveTo(180, horizonY - 95, 360, horizonY - 25);
      ctx.quadraticCurveTo(560, horizonY + 45, 720, horizonY - 55);
      ctx.lineTo(720, 1280);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(5, 6, 14, 0.82)';
      ctx.beginPath();
      ctx.moveTo(0, 1280);
      ctx.lineTo(0, horizonY + 90);
      ctx.quadraticCurveTo(240, horizonY + 25, 450, horizonY + 85);
      ctx.quadraticCurveTo(600, horizonY + 115, 720, horizonY + 60);
      ctx.lineTo(720, 1280);
      ctx.closePath();
      ctx.fill();

      // Out-of-focus cinematic foreground bokeh orbs
      for (let i = 0; i < 16; i++) {
        const bx = (i * 97 + sceneIdx * 71) % 720;
        const by = 140 + ((i * 157 + sceneIdx * 53) % 860);
        const br = 12 + (i % 5) * 14;
        ctx.beginPath();
        ctx.fillStyle = i % 3 === 0 ? '#FFFFFF' : pal[2];
        ctx.globalAlpha = 0.06 + (i % 4) * 0.035;
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      return c.toDataURL('image/jpeg', 0.86);
    }

    async function executeOneClickAiGenerate() {
      if (isStudioGenerating) return;
      const q = getTrialQuotas();
      if (!state.profile.isVip && q.videosLeft <= 0) {
        showToast('Daily AI Video quota reached! Upgrade VIP for unlimited access.', 'error');
        switchTab('vip');
        return;
      }

      const s = state.aiStudioState;
      const mode = ['prompt', 'photo', 'script'].includes(s.studioMode) ? s.studioMode : 'prompt';
      const cat = getActiveStudioCategory();
      const activeBeat = getActiveStudioBeat();
      const customTopic = (s.customTopic || '').trim();
      const customScript = (s.customScriptInput || '').trim();

      // Extract base64 if photo was loaded
      let photoBase64 = studioMediaCache.uploadedPhotoBase64 || '';
      let photoMime = studioMediaCache.uploadedPhotoMime || 'image/jpeg';
      if (!photoBase64 && s.coverDataUrl && s.coverDataUrl.startsWith('data:image/')) {
        const idx = s.coverDataUrl.indexOf(',');
        if (idx > 0) {
          photoBase64 = s.coverDataUrl.slice(idx + 1);
          photoMime = s.coverDataUrl.slice(5, s.coverDataUrl.indexOf(';')) || 'image/jpeg';
        }
      }

      if (mode === 'photo' && !photoBase64) {
        showToast('📸 Please upload a photo from your gallery first!', 'error');
        return;
      }
      if (mode === 'script' && !customScript) {
        showToast('📝 Please paste your Hindi/Hinglish script or tap Sample!', 'error');
        return;
      }

      const topic = customTopic || (mode === 'script' ? customScript.split('\n')[0].slice(0, 70) : `${cat.titleHindi} (${cat.titleEnglish})`);
      stopStudioVoiceover();
      if (studioMediaCache.veoVideoUrl) {
        try { URL.revokeObjectURL(studioMediaCache.veoVideoUrl); } catch (_) {}
        studioMediaCache.veoVideoUrl = '';
        studioMediaCache.veoMimeType = '';
      }

      isStudioGenerating = true;
      s.errorMsg = '';
      s.progressStep = 1;
      s.progressStage = mode === 'photo'
        ? '1. Gemini Vision analyzing uploaded photo...'
        : mode === 'script'
          ? '1. Splitting your script into 4 timed scenes...'
          : '1. Gemini 3.8 Flash directing 4-scene AI script...';
      s.progressPct = 24;
      renderOverlay();

      try {
        // STEP 1: Generate 4-scene Hindi/Hinglish storyboard + visual prompts + voiceover script
        const res = await callStudioScenesBackend({
          mode,
          topic,
          scriptText: customScript,
          category: cat,
          beatName: activeBeat.name,
          imageBase64: mode === 'photo' ? photoBase64 : '',
          imageMimeType: photoMime
        });

        const scenes = Array.isArray(res.data.scenes) && res.data.scenes.length
          ? res.data.scenes.slice(0, 4)
          : [0, 1, 2, 3].map(i => ({
              timeRange: `${i * 3}-${(i + 1) * 3}s`,
              caption: res.data.title || topic,
              visualPrompt: `Cinematic 9:16 scene ${i + 1} for ${topic}`,
              cameraMotion: ['zoom-in', 'pan-right', 'zoom-out', 'pan-left'][i]
            }));

        s.studioVersion = 2;
        s.aiSource = res.source || 'LIVE_GEMINI';
        s.title = res.data.title || topic;
        s.voiceoverText = res.data.voiceoverText || res.data.script || scenes.map(sc => sc.caption).join(' ');
        s.script = `${res.data.script || scenes.map((sc, i) => `[${sc.timeRange || `${i*3}-${(i+1)*3}s`}] ${sc.caption}`).join('\n')}\n\n🛍️ Shop Deals (ID ${CONSTANTS.AFFILIATE_TAG}): ${CONSTANTS.PERMANENT_OWNER_AFFILIATE_LINK}`;
        s.hashtags = res.data.hashtags || '#ViralReels #TrendingShorts #ViralBoostAI';
        s.scenes = scenes;

        // STEP 2: Attempt Google Veo real AI video generation, else 4-Scene Imagen 3 / Photo 3D Motion
        s.progressStep = 2;
        s.progressStage = mode === 'photo'
          ? '2. Animating Photo via Veo / 3D Motion Engine...'
          : '2. Rendering 4-Scene Cinema Visuals...';
        s.progressPct = 58;
        renderOverlay();

        const veoPrompt = `${scenes.map((sc, i) => `Scene ${i + 1}: ${sc.visualPrompt || sc.caption}`).join('. ')}. Photorealistic 9:16 vertical short reel, cinematic lighting.`;
        const veoRes = await callVeoBackend({
          prompt: veoPrompt,
          imageBase64: mode === 'photo' ? photoBase64 : '',
          imageMimeType: photoMime,
          aspectRatio: '9:16'
        });

        if (veoRes && veoRes.ok && veoRes.videoUrl) {
          studioMediaCache.veoVideoUrl = veoRes.videoUrl;
          studioMediaCache.veoMimeType = veoRes.mimeType || 'video/mp4';
          s.engineUsed = 'VEO_VIDEO';
          if (mode === 'photo' && studioMediaCache.uploadedPhotoDataUrl) {
            studioMediaCache.sceneDataUrls = [0, 1, 2, 3].map(() => studioMediaCache.uploadedPhotoDataUrl);
          } else {
            studioMediaCache.sceneDataUrls = scenes.map((sc, idx) => generatePhotorealisticSceneBackdropDataUrl(sc, idx, cat));
          }
          s.coverDataUrl = studioMediaCache.sceneDataUrls[0] || '';
        } else if (mode === 'photo') {
          // Photo-to-Video: build 4 color-graded 3D camera cuts from the user's uploaded photo
          const photoImg = await preloadStudioCoverForExport(studioMediaCache.uploadedPhotoDataUrl || s.coverDataUrl);
          const photoScenes = scenes.map((sc, idx) => createCinematicPhotoSceneDataUrl(photoImg, idx, cat, sc));
          studioMediaCache.sceneDataUrls = photoScenes;
          s.coverDataUrl = photoScenes[0] || studioMediaCache.uploadedPhotoDataUrl || s.coverDataUrl;
          s.engineUsed = 'PHOTO_3D_MOTION';
        } else {
          // Prompt / Script mode: try Gemini/Imagen for all 4 scenes when live, with photorealistic 4-scene fallback
          const imgResults = s.aiSource === 'SMART_STUDIO'
            ? []
            : await Promise.allSettled(
                scenes.map((sc) =>
                  callImagenBackend({
                    prompt: `Photorealistic 9:16 vertical film still, 35mm cinema lens, ${sc.visualPrompt || sc.caption || topic}, category ${cat.titleEnglish}, dramatic realistic lighting, no text overlay`,
                    aspectRatio: '9:16'
                  }).catch(() => null)
                )
              );
          const finalSceneUrls = scenes.map((sc, idx) => {
            const r = imgResults[idx];
            if (r && r.status === 'fulfilled' && r.value && r.value.ok && r.value.dataUrl) {
              return r.value.dataUrl;
            }
            return generatePhotorealisticSceneBackdropDataUrl(sc, idx, cat);
          });
          studioMediaCache.sceneDataUrls = finalSceneUrls;
          s.coverDataUrl = finalSceneUrls[0] || '';
          s.engineUsed = 'IMAGEN_MULTI_SCENE';
        }

        refreshStudioSceneImagesCache();
        reelPreviewElapsedSec = 0;

        state.profile.videosUsed += 1;
        state.profile.aiGenCount = (state.profile.aiGenCount || 0) + 1;
        s.isPlaying = true;
        s.progressStep = 3;
        s.progressStage = s.engineUsed === 'VEO_VIDEO'
          ? '3. Google Veo 9:16 MP4 Stream Ready!'
          : s.aiSource === 'SMART_STUDIO'
            ? '3. Smart 4-Scene 1080×1920 @ 30FPS Ready! (Live Gemini busy)'
            : '3. 4-Scene 1080×1920 @ 30FPS Motion Ready!';
        s.progressPct = 100;
        state.aiHistory.unshift({
          id: 'ai_' + Date.now(),
          type: mode === 'photo' ? 'PHOTO_TO_VIDEO' : mode === 'script' ? 'SCRIPT_TO_VIDEO' : 'TEXT_TO_VIDEO',
          topic: s.title,
          platform: 'Instagram Reels & Shorts',
          content: s.script,
          hashtags: s.hashtags,
          bookmarked: false,
          time: Date.now()
        });
        isStudioGenerating = false;
        saveState();
        syncProfileToCloud();
        renderOverlay();

        if (s.voiceEnabled !== false) {
          setTimeout(() => speakStudioVoiceover(s.voiceoverText), 250);
        }

        const readyLabel = s.engineUsed === 'VEO_VIDEO'
          ? '🎬 Google Veo Native 9:16 Video Ready!'
          : s.engineUsed === 'PHOTO_3D_MOTION'
            ? '📸 3D Photo Motion Reel Ready!'
            : '🎞️ 4-Scene Photorealistic AI Reel Ready!';
        showToast(readyLabel, 'success');

        if (s.engineUsed !== 'VEO_VIDEO') {
          if (state.profile.aiGenCount % 3 === 0) {
            UnityAdEngine.showInterstitial('ai_gen', () => {
              if (activeOverlay === 'oneClickAiStudio' && !isExportingVideo) {
                exportOneClickReelVideo();
              }
            });
          } else {
            setTimeout(() => {
              if (activeOverlay === 'oneClickAiStudio' && !isExportingVideo) {
                exportOneClickReelVideo();
              }
            }, 450);
          }
        }
      } catch (err) {
        isStudioGenerating = false;
        s.progressStep = 0;
        s.progressStage = '';
        s.progressPct = 0;
        s.errorMsg = String(err?.message || err || 'Live AI failed');
        saveState();
        renderOverlay();
        showToast(`⚠️ Live AI Failed: ${s.errorMsg}`, 'error');
      }
    }

      const utr = (document.getElementById('upi-utr-input')?.value || '').trim().replace(/\s+/g, '');

      if (state.payments.some(p => p.utr === utr)) {
        showToast('This UTR has already been submitted!', 'error');
        return;
      }
      const plan = PLANS.find(x => x.id === planId);
      const discChecked = Boolean(document.getElementById('upi-diamond-disc')?.checked);
      const maxDisc = discChecked ? Math.min(10, Math.floor(state.profile.diamonds / 5)) : 0;
      const diamondsUsed = maxDisc * 5;
      const finalAmt = Math.max(1, plan.priceRupees - maxDisc);

      if (diamondsUsed > 0) {
        state.profile.diamonds -= diamondsUsed;
        state.transactions.unshift({
          id: 'tx_' + Date.now(),
          title: `UPI Checkout Discount (${plan.name})`,
          subtitle: `Applied ${diamondsUsed} 💎 for ₹${maxDisc} off`,
          diamonds: diamondsUsed,
          coins: 0,
          earned: false,
          tag: 'CHECKOUT',
          time: Date.now()
        });
      }

      const payRec = {
        id: 'pay_' + Date.now(),
        planId: plan.id,
        planName: plan.name,
        amount: finalAmt,
        utr,
        status: 'PENDING',
        time: Date.now()

      state.payments.unshift(payRec);
      const tktRec = {
        id: 'TKT-' + Math.floor(1000 + Math.random() * 9000),

    function formatReelDate(ts) {
      const n = Number(ts) || 0;
      if (!n) return '';
      const diffMs = Date.now() - n;
      if (diffMs >= 0 && diffMs < 60000) return 'Just now';
      if (diffMs >= 0 && diffMs < 3600000) return `${Math.floor(diffMs / 60000)}m ago`;
      if (diffMs >= 0 && diffMs < 86400000) return `${Math.floor(diffMs / 3600000)}h ago`;
      try {
        return new Date(n).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      } catch (_) {
        return '';
      }
    }
