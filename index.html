    function copyText(text, label = 'Copied to clipboard') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`📋 ${label}`, 'success')).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(`📋 ${label}`, 'success'); } catch (e) {}
      ta.remove();
    }

    // =========================================================================
    // 7. INTERACTIVE ACTIONS, CANVAS RENDERER & SYNTH AUDIO BEAT PLAYER
    // =========================================================================
    function startReelCanvasLoop() {
      const canvas = document.getElementById('reel-studio-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let t = 0;
      let coverImg = null;
      if (state.aiStudioState.coverDataUrl) {
        coverImg = new Image();
        coverImg.src = state.aiStudioState.coverDataUrl;
      }

      function draw() {
        const c = document.getElementById('reel-studio-canvas');
        if (!c || activeOverlay !== 'oneClickAiStudio') return;
        const cat = AI_VIDEO_CATEGORIES[state.aiStudioState.catIdx];
        if (state.aiStudioState.isPlaying) t += 0.045;

        const w = c.width, h = c.height;
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#09071A');
        grad.addColorStop(0.5, cat.secondary + '44');
        grad.addColorStop(1, cat.accent + '55');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        if (coverImg && coverImg.complete && coverImg.naturalWidth > 0) {
          ctx.save();
          ctx.globalAlpha = 0.45;
          const zoom = 1 + Math.sin(t * 0.7) * 0.04;
          const dw = w * zoom, dh = h * zoom;
          ctx.drawImage(coverImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
          ctx.restore();
        }

        // Animated neon rings
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.strokeStyle = i % 2 === 0 ? cat.accent : '#00E5FF';
          ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t + i);
          ctx.lineWidth = 2;
          ctx.arc(w / 2, h * 0.42, 48 + i * 28 + Math.sin(t * 1.5 + i) * 8, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // Category Emoji & Visualizer bars
        ctx.font = '56px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cat.emoji, w / 2, h * 0.36 + Math.sin(t * 2) * 6);

        const bars = 18;
        const bw = (w - 60) / bars;
        for (let b = 0; b < bars; b++) {
          const bh = 16 + Math.abs(Math.sin(t * 3 + b * 0.6)) * 52;
          ctx.fillStyle = b % 2 === 0 ? '#00E5FF' : cat.accent;
          ctx.fillRect(30 + b * bw + 2, h * 0.56 - bh / 2, bw - 5, bh);
        }

        // Hook Caption Card Overlay
        ctx.fillStyle = 'rgba(7, 7, 18, 0.78)';
        ctx.fillRect(18, h * 0.65, w - 36, 98);
        ctx.strokeStyle = cat.accent;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(18, h * 0.65, w - 36, 98);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        wrapCanvasText(ctx, state.aiStudioState.title || cat.sampleHook, w / 2, h * 0.65 + 30, w - 58, 20);

        if (!state.profile.isVip) {
          ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
          ctx.font = 'bold 11px monospace';
          ctx.fillText('⚡ Created with ViralBoost AI', w / 2, 28);
        }

        canvasRaf = requestAnimationFrame(draw);
      }
      if (canvasRaf) cancelAnimationFrame(canvasRaf);
      canvasRaf = requestAnimationFrame(draw);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text).split(' ');
      let line = '';
      let cy = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, cy);
          line = words[n] + ' ';
          cy += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, cy);
    }

    function toggleBeatSynth(bpm = 128) {
      if (isAudioPlaying) {
        stopBeatSynth();
        renderOverlay();
        return;
      }
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isAudioPlaying = true;
        const interval = (60 / bpm) * 1000;
        let step = 0;
        const playKick = () => {
          if (!isAudioPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = step % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(step % 4 === 0 ? 140 : 220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(42, audioCtx.currentTime + 0.14);
          gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.16);
          step++;
        };
        playKick();
        beatTimer = setInterval(playKick, interval);
        renderOverlay();
      } catch (e) {
        showToast('Audio preview requires browser interaction first', 'info');
      }
    }

    function stopBeatSynth() {
      isAudioPlaying = false;
      if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
    }

    function verifyAdminLogin() {
      const inp = (document.getElementById('admin-pass-input')?.value || '').trim();
      if (inp === CONSTANTS.OWNER_PASSKEY || inp.toLowerCase() === CONSTANTS.OWNER_UPI_ID.toLowerCase()) {
        closeModal();
        openOverlay('adminPanel');
      } else {
        showToast('Invalid Admin Passkey!', 'error');
      }
    }

    function approveAdminUpi(idx) {
      if (state.payments[idx]) {
        state.payments[idx].status = 'VERIFIED';
        state.profile.isVip = true;
        saveState();
        renderOverlay();
        showToast('✅ Payment Approved by Owner!', 'success');
      }
    }

    function replyAdminTicket(idx) {
      const val = (document.getElementById(`admin-reply-${idx}`)?.value || '').trim();
      if (!val) return;
      state.tickets[idx].status = 'RESOLVED';
      state.tickets[idx].reply = 'Owner Reply: ' + val;
      saveState();
      renderOverlay();
      showToast('📤 Admin Reply Sent!', 'success');
    }

    function drawInsightsCharts() {
      const canvas = document.getElementById('insights-trend-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = (rect.width || 340) * dpr;
      canvas.height = 110 * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width || 340, h = 110;
      const presetTrends = [
        [24, 38, 46, 64, 78, 89, 97],
        [30, 45, 59, 72, 84, 93, 100],
        [20, 31, 49, 57, 71, 83, 92]
      ];
      const presetBases = [
        [15, 22, 29, 36, 44, 51, 58],
        [18, 25, 33, 41, 48, 55, 63],
        [14, 19, 26, 31, 38, 45, 52]
      ];
      const trend = presetTrends[state.insightPresetIdx] || presetTrends[0];
      const base = presetBases[state.insightPresetIdx] || presetBases[0];
      const plot = (arr, color, fill) => {
        ctx.beginPath();
        arr.forEach((v, i) => {
          const x = 14 + (i * (w - 28)) / (arr.length - 1);
          const y = h - 18 - (v / 100) * (h - 32);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill) {
          ctx.lineTo(w - 14, h - 18); ctx.lineTo(14, h - 18); ctx.closePath();
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, 'rgba(0, 229, 255, 0.28)'); g.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
          ctx.fillStyle = g; ctx.fill();
        }
      };
      plot(base, '#475569', false);
      plot(trend, '#00E5FF', true);
    }

    // =========================================================================
    // 8. BOOTSTRAP & TICKER LOOP
    // =========================================================================
    setInterval(() => {
      tickerIdx = (tickerIdx + 1) % TICKER_MESSAGES.length;
      const el = document.getElementById('live-ticker-text');
      if (el) {
        el.textContent = TICKER_MESSAGES[tickerIdx];
        el.classList.remove('ticker-anim');
        void el.offsetWidth;
        el.classList.add('ticker-anim');
      }
    }, 4000);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!document.getElementById('modal-host').classList.contains('hidden')) closeModal();
        else if (activeOverlay) closeOverlay();
      }
    });

    window.addEventListener('resize', () => {
      if (state.activeTab === 'home' && !activeOverlay) drawInsightsCharts();
    });

    renderApp();
  </script>
</body>
</html>
