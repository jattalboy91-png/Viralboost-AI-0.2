    function buildTaggedAffiliateUrl(rawUrl, product) {
      const personal = (state.profile.personalAffiliateLink || '').trim();
      let base = (rawUrl || '').trim();
      if (!base && product) {
        const q = encodeURIComponent(product.title);
        if (product.platform === 'Amazon') base = `https://www.amazon.in/s?k=${q}`;
        else if (product.platform === 'Flipkart') base = `https://www.flipkart.com/search?q=${q}`;
        else if (product.platform === 'Meesho') base = `https://www.meesho.com/search?q=${q}`;
      }
      if (!base) return personal || CONSTANTS.PERMANENT_OWNER_AFFILIATE_LINK;
      try {
        const u = new URL(base);
        const host = u.hostname.toLowerCase();
        if (host.includes('amazon')) u.searchParams.set('tag', `vb${CONSTANTS.AFFILIATE_TAG}-21`);
        else if (host.includes('flipkart') || host.includes('shopsy')) u.searchParams.set('affid', CONSTANTS.AFFILIATE_TAG);
        else if (host.includes('meesho')) u.searchParams.set('referral_code', CONSTANTS.AFFILIATE_TAG);
        else u.searchParams.set('ref', CONSTANTS.AFFILIATE_TAG);
        return u.toString();
      } catch (_) {
        return personal || CONSTANTS.PERMANENT_OWNER_AFFILIATE_LINK;
      }
    }

        const normalizeParsed = (parsed, rawFallback = "") => {

          const defaultLines = String(parsed?.script || parsed?.voiceoverText || scriptText || topic)

              visualPrompt: String(sc.visualPrompt || `Photorealistic 9:16 cinematic scene ${i + 1} for ${category.titleEnglish || "Reel"}: ${topic}`),
              cameraMotion: motions.includes(sc.cameraMotion) ? sc.cameraMotion : motions[i]

          const tagsArr = Array.isArray(parsed?.hashtags)

        }
      };

      onAuthStateChanged(auth, async (user) => {
        bridge.currentUser = user;
        cloudUser = user;
        authUiState.googleLoading = false;
        if (lbUnsubscribe) { lbUnsubscribe(); lbUnsubscribe = null; }

        if (user) {
          try {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
              const d = snap.data();
              if (typeof d.coins === "number") state.profile.coins = d.coins;
              if (typeof d.diamonds === "number") state.profile.diamonds = d.diamonds;
              if (typeof d.lifetimeDiamonds === "number") state.profile.lifetimeDiamonds = d.lifetimeDiamonds;
              if (typeof d.bonusRupees === "number") state.profile.bonusRupees = d.bonusRupees;
              if (typeof d.streakDays === "number") state.profile.streakDays = d.streakDays;
              if (typeof d.isVip === "boolean") state.profile.isVip = d.isVip;
              if (d.planTier) state.profile.planTier = d.planTier;
              if (typeof d.vipExpiryDate === "number") state.profile.vipExpiresAt = d.vipExpiryDate;
              if (d.username) state.profile.username = d.username;
              if (d.email) state.profile.email = d.email;
              if (d.niche) state.profile.niche = d.niche;
              if (d.displayUserId) state.profile.displayUserId = d.displayUserId;
              if (d.connectedPlatforms && typeof d.connectedPlatforms === "object") {
                state.channels = sanitizeChannelsMap(d.connectedPlatforms);
              } else {
                state.channels = emptyChannelsState();
              }

              if (d.hasAgreedToTerms === true) {
                state.profile.hasAgreedToTerms = true;
                state.profile.legalAccepted = true;
                state.profile.legalAgreementTimestamp = d.legalAgreementTimestamp || new Date().toISOString();
                state.profile.isLoggedIn = true;
                state.profile.authMethod = d.authMethod || "google";
              }
              saveState();
            } else {
              if (user.displayName && !state.profile.username) {
                state.profile.username = user.displayName;
              }
              if (user.email && !state.profile.email) {
                state.profile.email = user.email;
              }
              if (authUiState.pendingGoogleSignup && authUiState.agreed) {
                const ts = new Date().toISOString();
                state.profile.isLoggedIn = true;
                state.profile.hasAgreedToTerms = true;
                state.profile.legalAccepted = true;
                state.profile.legalAgreementTimestamp = ts;
                state.profile.authMethod = "google";
                state.profile.userContact = user.email || user.uid;
                state.profile.welcomeClaimed = true;
                state.profile.coins = 0;
                state.profile.diamonds = 0;
                state.profile.bonusRupees = 0;
                state.channels = emptyChannelsState();
                state.legalAuditLogs.unshift({
                  name: state.profile.username || user.displayName || "Creator",
                  contact: state.profile.userContact,
                  method: "google",
                  timestamp: ts,
                  status: "AGREED_AND_VERIFIED"
                });
                saveState();
                await bridge.syncUserProfileAndLeaderboard(state.profile, state.channels);
                showToast("🟢 Google Cloud Sync Verified! Connected to Firestore.", "success");
              } else {
                if (!authUiState.name && user.displayName) authUiState.name = user.displayName;
                if (!authUiState.contact && user.email) {
                  authUiState.contact = user.email;
                  authUiState.method = "email";
                }
                saveState();
              }
            }

            if (authUiState.pendingGoogleSignup && !isUserAuthenticated() && !authUiState.agreed) {
              showToast("Google connected! Please tick Mandatory Legal Terms & tap Complete Sign Up.", "info");
            }
            authUiState.pendingGoogleSignup = false;

            const q = query(collection(db, "leaderboard"), orderBy("viralScore", "desc"), limit(50));
            lbUnsubscribe = onSnapshot(q, (snapshot) => {
              cloudLeaderboard = snapshot.docs.map(docSnap => {
                const cd = docSnap.data() || {};
                return {
                  uid: cd.uid || docSnap.id,
                  name: cd.name || "Creator",
                  niche: cd.niche || "Shorts & Reels",
                  coins: Number(cd.coins) || 0,
                  diamonds: Number(cd.diamonds) || 0,
                  isVip: Boolean(cd.isVip)
                };
              });
              if (isUserAuthenticated() && state.activeTab === "ranks" && !activeOverlay) renderApp();
            }, (err) => console.warn("Leaderboard snapshot:", err));

            if (activeOverlay === "adminPanel" && (user.email || "").toLowerCase() === "jattalboy91@gmail.com") {
              refreshAdminUsers(true);
            }
          } catch (syncErr) {
            console.warn("Cloud restore warning:", syncErr);
          }
        } else {
          cloudLeaderboard = [];
        }
        syncHeader();
        if (activeOverlay) renderOverlay(); else renderApp();
      });

      syncHeader();
    } catch (initErr) {
      console.error("Firebase initialization warning:", initErr);
    } finally {
      if (resolveReady) resolveReady(bridge);
    }
  </script>
</body>
</html>
