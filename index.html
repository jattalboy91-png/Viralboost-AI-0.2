    function showToast(msg, type = 'info') {

      host.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 250);
      }, 2800);
    }

    function copyText(text, label = 'Copied to clipboard') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(`📋 ${label}`, 'success')).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }
    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(`📋 ${label}`, 'success'); } catch (e) {}
      ta.remove();
    }

    // =========================================================================
    // 7. INTERACTIVE ACTIONS, CANVAS RENDERER & SYNTH AUDIO BEAT PLAYER
    // =========================================================================
    function startReelCanvasLoop() {
      const canvas = document.getElementById('reel-studio-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let t = 0;
      let coverImg = null;
      if (state.aiStudioState.coverDataUrl) {
        coverImg = new Image();
        coverImg.src = state.aiStudioState.coverDataUrl;
      }

      function draw() {
        const c = document.getElementById('reel-studio-canvas');
        if (!c || activeOverlay !== 'oneClickAiStudio') return;
        const cat = AI_VIDEO_CATEGORIES[state.aiStudioState.catIdx];
        if (state.aiStudioState.isPlaying) t += 0.045;

        const w = c.width, h = c.height;
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, '#09071A');
        grad.addColorStop(0.5, cat.secondary + '44');
        grad.addColorStop(1, cat.accent + '55');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        if (coverImg && coverImg.complete && coverImg.naturalWidth > 0) {
          ctx.save();
          ctx.globalAlpha = 0.45;
          const zoom = 1 + Math.sin(t * 0.7) * 0.04;
          const dw = w * zoom, dh = h * zoom;
          ctx.drawImage(coverImg, (w - dw) / 2, (h - dh) / 2, dw, dh);
          ctx.restore();
        }

        // Animated neon rings
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.strokeStyle = i % 2 === 0 ? cat.accent : '#00E5FF';
          ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t + i);
          ctx.lineWidth = 2;
          ctx.arc(w / 2, h * 0.42, 48 + i * 28 + Math.sin(t * 1.5 + i) * 8, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // Category Emoji & Visualizer bars
        ctx.font = '56px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cat.emoji, w / 2, h * 0.36 + Math.sin(t * 2) * 6);

        const bars = 18;
        const bw = (w - 60) / bars;
        for (let b = 0; b < bars; b++) {
          const bh = 16 + Math.abs(Math.sin(t * 3 + b * 0.6)) * 52;
          ctx.fillStyle = b % 2 === 0 ? '#00E5FF' : cat.accent;
          ctx.fillRect(30 + b * bw + 2, h * 0.56 - bh / 2, bw - 5, bh);
        }

        // Hook Caption Card Overlay
        ctx.fillStyle = 'rgba(7, 7, 18, 0.78)';
        ctx.fillRect(18, h * 0.65, w - 36, 98);
        ctx.strokeStyle = cat.accent;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(18, h * 0.65, w - 36, 98);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 14px "Plus Jakarta Sans", sans-serif';
        wrapCanvasText(ctx, state.aiStudioState.title || cat.sampleHook, w / 2, h * 0.65 + 30, w - 58, 20);

        if (!state.profile.isVip) {
          ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
          ctx.font = 'bold 11px monospace';
          ctx.fillText('⚡ Created with ViralBoost AI', w / 2, 28);
        }

        canvasRaf = requestAnimationFrame(draw);
      }
      if (canvasRaf) cancelAnimationFrame(canvasRaf);
      canvasRaf = requestAnimationFrame(draw);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text).split(' ');
      let line = '';
      let cy = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, cy);
          line = words[n] + ' ';
          cy += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, cy);
    }

    function toggleBeatSynth(bpm = 128) {
      if (isAudioPlaying) {
        stopBeatSynth();
        renderOverlay();
        return;
      }
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isAudioPlaying = true;
        const interval = (60 / bpm) * 1000;
        let step = 0;
        const playKick = () => {
          if (!isAudioPlaying) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = step % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(step % 4 === 0 ? 140 : 220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(42, audioCtx.currentTime + 0.14);
          gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.16);
          step++;
        };
        playKick();
        beatTimer = setInterval(playKick, interval);
        renderOverlay();
      } catch (e) {
        showToast('Audio preview requires browser interaction first', 'info');
      }
    }

    function stopBeatSynth() {
      isAudioPlaying = false;
      if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
    }

    async function callGeminiBackend({ prompt, platform = 'Instagram Reels & YouTube Shorts', tone = 'High-Energy Viral (Hinglish)', contentType = 'REEL_KIT', expectJson = true, history = [] }) {
      const cleanPrompt = String(prompt || '').trim();

      if (window.ViralBoostFirebaseReady) {
        try { await Promise.race([window.ViralBoostFirebaseReady, new Promise(r => setTimeout(r, 2500))]); } catch (_) {}
      }

      // 1) Primary Production Engine: Official Firebase AI Logic Web SDK + App Check (Zero API Key Exposure)

      const proxyEndpoint = resolveGeminiProxyEndpoint();
      if (proxyEndpoint) {
        try {
          const resp = await fetch(proxyEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: cleanPrompt, platform, tone, contentType, expectJson, history })
          });
          if (resp.ok) {
            const payload = await resp.json();
            if (payload && payload.ok && payload.data) {
              return { ok: true, source: 'LIVE_GEMINI', data: payload.data };

      }

      // 3) Tertiary Engine: Optional Personal Key for local offline file:// Chrome usage
      const userKey = (localStorage.getItem(GEMINI_KEY_STORAGE) || '').trim();
      if (userKey) {
        try {
          const sysText = 'You are ViralBoost AI, an expert bilingual (Hindi + Hinglish + English) short-form video strategist and social growth engineer for Indian creators.';
          const promptBody = expectJson

          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(userKey)}`, {
            method: 'POST',

              systemInstruction: { parts: [{ text: sysText }] },
              contents,
              generationConfig: cfg
            })
          });
          const raw = await r.json();
          if (!r.ok) {
            throw new Error(raw?.error?.message || 'Gemini API Key Error');
          }
          const txt = raw?.candidates?.[0]?.content?.parts?.[0]?.text || '';
          if (txt) {
            if (!expectJson) {
              return { ok: true, source: 'LIVE_GEMINI', data: { rawText: txt } };

              parsed = { title: `🔥 ${cleanPrompt}`, hook: txt.split('\n')[0] || '', script: txt, cta: 'Share & Comment 🔥', hashtags: '#ViralReels #TrendingShorts #ViralBoostAI' };
            }
            return {
              ok: true,
              source: 'LIVE_GEMINI',
              data: {
                title: String(parsed.title || `🔥 ${cleanPrompt}`),
                hook: String(parsed.hook || ''),

                rawText: txt
              }
            };
          }
        } catch (err) {
          showToast(`⚠️ Gemini Error: ${err.message}`, 'error');

      // 4) Offline Smart Blueprint Fallback

    async function exportOneClickReelVideo() {
      const canvas = document.getElementById('reel-studio-canvas');
      if (!canvas) {
        showToast('Canvas not ready — open AI Video Studio first!', 'error');
        return;
      }
      if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
        showToast('Your browser does not support in-browser video recording.', 'error');
        return;
      }
      if (isExportingVideo) return;

      isExportingVideo = true;
      exportProgressPct = 5;
      state.aiStudioState.isPlaying = true;
      renderOverlay();

      try {
        const cat = AI_VIDEO_CATEGORIES[state.aiStudioState.catIdx];
        const videoStream = canvas.captureStream(30);
        const tracks = [...videoStream.getVideoTracks()];

        // Route synthesized WebAudio beat into MediaRecorder audio track
        let beatInterval = null;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          const dest = audioCtx.createMediaStreamDestination();
          let step = 0;
          const pulseMs = (60 / (cat.bpm || 128)) * 1000;
          const triggerPulse = () => {
            if (!isExportingVideo) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = step % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(step % 4 === 0 ? 135 : 210, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(44, audioCtx.currentTime + 0.14);
            g.gain.setValueAtTime(0.24, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
            osc.connect(g);
            g.connect(dest);
            g.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.16);
            step++;
          };
          triggerPulse();
          beatInterval = setInterval(triggerPulse, pulseMs);
          tracks.push(...dest.stream.getAudioTracks());
        } catch (_) {}

        const combined = new MediaStream(tracks);
        const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
          ? 'video/webm;codecs=vp9,opus'
          : MediaRecorder.isTypeSupported('video/webm')
            ? 'video/webm'
            : '';
        const recorder = mime ? new MediaRecorder(combined, { mimeType: mime }) : new MediaRecorder(combined);
        const chunks = [];
        recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };

        const durationMs = 5000;
        const startT = Date.now();
        const progTimer = setInterval(() => {
          exportProgressPct = Math.min(96, Math.round(((Date.now() - startT) / durationMs) * 100));
        }, 250);

        recorder.onstop = () => {
          clearInterval(progTimer);
          if (beatInterval) clearInterval(beatInterval);
          isExportingVideo = false;
          exportProgressPct = 100;
          const blob = new Blob(chunks, { type: mime || 'video/webm' });
          exportedReelBlob = blob;
          if (exportedReelUrl) {
            try { URL.revokeObjectURL(exportedReelUrl); } catch (_) {}
          }
          exportedReelUrl = URL.createObjectURL(blob);
          renderOverlay();
          showToast('🎬 Real 9:16 Video Rendered! Ready to Download & Share!', 'success');
        };

        recorder.start(200);
        setTimeout(() => {
          if (recorder.state !== 'inactive') recorder.stop();
        }, durationMs);
      } catch (e) {
        isExportingVideo = false;
        renderOverlay();
        showToast('Video export failed: ' + (e.message || 'Unknown error'), 'error');
      }
    }

    function submitUtrPayment(planId) {
      const utr = (document.getElementById('upi-utr-input')?.value || '').trim().replace(/\s+/g, '');
      if (!/^\d{12}$/.test(utr)) {
        showToast('Please enter a valid 12-digit numeric UTR number!', 'error');
        return;
      }
      if (state.payments.some(p => p.utr === utr)) {
        showToast('This UTR has already been submitted!', 'error');
        return;
      }
      const plan = PLANS.find(x => x.id === planId);
      const discChecked = Boolean(document.getElementById('upi-diamond-disc')?.checked);
      const maxDisc = discChecked ? Math.min(10, Math.floor(state.profile.diamonds / 5)) : 0;
      const diamondsUsed = maxDisc * 5;
      const finalAmt = Math.max(1, plan.priceRupees - maxDisc);

      if (diamondsUsed > 0) {
        state.profile.diamonds -= diamondsUsed;
        state.transactions.unshift({
          id: 'tx_' + Date.now(),
          title: `UPI Checkout Discount (${plan.name})`,
          subtitle: `Applied ${diamondsUsed} 💎 for ₹${maxDisc} off`,
          diamonds: diamondsUsed,
          coins: 0,
          earned: false,
          tag: 'CHECKOUT',
          time: Date.now()
        });
      }

      const payRec = {
        id: 'pay_' + Date.now(),
        planId: plan.id,
        planName: plan.name,
        amount: finalAmt,
        utr,
        status: 'PENDING',
        time: Date.now()
      };
      state.payments.unshift(payRec);
      const tktRec = {
        id: 'TKT-' + Math.floor(1000 + Math.random() * 9000),
        category: 'Payment & 12-Digit UTR',
        subject: `UTR ${utr} Verification (${plan.name} - ₹${finalAmt})`,
        message: `Submitted UTR ${utr} to ${CONSTANTS.OWNER_UPI_ID} for ${plan.name}. Awaiting Owner Admin verification.`,
        status: 'OPEN',
        reply: '',
        time: Date.now()
      };
      state.tickets.unshift(tktRec);
      saveState();
      syncProfileToCloud();
      if (window.ViralBoostFirebase && window.ViralBoostFirebase.currentUser) {
        window.ViralBoostFirebase.submitPayment(payRec);
        window.ViralBoostFirebase.submitTicket(tktRec);
      }
      closeModal();
      renderApp();
      showToast(`⏳ UTR ${utr} Submitted! Pending Owner Admin Approval.`, 'info');
    }

      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = (rect.width || 340) * dpr;
      canvas.height = 110 * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width || 340, h = 110;
      const presetTrends = [
        [24, 38, 46, 64, 78, 89, 97],
        [30, 45, 59, 72, 84, 93, 100],
        [20, 31, 49, 57, 71, 83, 92]
      ];
      const presetBases = [
        [15, 22, 29, 36, 44, 51, 58],
        [18, 25, 33, 41, 48, 55, 63],
        [14, 19, 26, 31, 38, 45, 52]
      ];
      const trend = presetTrends[state.insightPresetIdx] || presetTrends[0];
      const base = presetBases[state.insightPresetIdx] || presetBases[0];
      const plot = (arr, color, fill) => {
        ctx.beginPath();
        arr.forEach((v, i) => {
          const x = 14 + (i * (w - 28)) / (arr.length - 1);
          const y = h - 18 - (v / 100) * (h - 32);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
        if (fill) {
          ctx.lineTo(w - 14, h - 18); ctx.lineTo(14, h - 18); ctx.closePath();
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, 'rgba(0, 229, 255, 0.28)'); g.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
          ctx.fillStyle = g; ctx.fill();
        }
      };
      plot(base, '#475569', false);
      plot(trend, '#00E5FF', true);
    }

          cta: Schema.string({ description: "High-converting comment/share/save call to action" }),
          hashtags: Schema.array({
            items: Schema.string(),
            description: "8-12 trending Hindi and English hashtags starting with #"
          }),
          tips: Schema.array({
            items: Schema.string(),
            description: "2 actionable posting or sound tips"
          })
        }
      });

      const structuredModel = getGenerativeModel(ai, {
        model: "gemini-2.5-flash",
        systemInstruction: "You are ViralBoost AI, an expert bilingual (Hindi + Hinglish + English) short-form video strategist and social growth engineer for Indian creators on Instagram Reels, YouTube Shorts, Facebook Reels, and Telegram.",
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: socialContentSchema,
          temperature: 0.8
        }
      });

      const chatModel = getGenerativeModel(ai, {
        model: "gemini-2.5-flash",
        systemInstruction: "You are ViralBoost AI, an expert bilingual (Hindi + Hinglish + English) short-form video strategist and social growth engineer for Indian creators."
      });
      bridge.aiReady = true;

      bridge.generateContent = async ({ prompt, platform, tone, contentType, expectJson = true, history = [] }) => {
        bridge.lastAiError = "";
        try {
          if (!expectJson) {
            const histParts = history.slice(-6).filter(m => m && m.text).map(m => ({
              role: m.sender === "USER" ? "user" : "model",
              parts: [{ text: String(m.text).slice(0, 1200) }]
            }));
            const contents = [...histParts, { role: "user", parts: [{ text: prompt }] }];
            const result = await chatModel.generateContent({ contents });
            const rawText = result.response.text();
            return {
              ok: true,
              source: "LIVE_GEMINI",
              data: { rawText }
            };
          }

          const fullPrompt = [
            `Content Mode: ${contentType}`,
            `Target Platform: ${platform}`,
            `Tone / Style: ${tone}`,
            `Topic / Request: ${prompt}`,
            "Generate a high-retention viral short-form video package in Hindi/Hinglish/English with trending #hashtags."
          ].join("\n");

          try {
            const result = await structuredModel.generateContent(fullPrompt);
            const jsonText = result.response.text();
            const parsed = JSON.parse(jsonText);
            const tagsArr = Array.isArray(parsed.hashtags) ? parsed.hashtags : [];
            const hashtags = tagsArr
              .map(t => String(t || "").trim())
              .filter(Boolean)
              .map(t => (t.startsWith("#") ? t : `#${t}`))
              .join(" ") || "#ViralReels #TrendingShorts #ViralBoostAI #ReelsIndia";
            return {
              ok: true,
              source: "LIVE_GEMINI",
              data: {
                title: String(parsed.title || `🔥 ${prompt}`),
                hook: String(parsed.hook || ""),
                script: String(parsed.script || jsonText),
                cta: String(parsed.cta || ""),
                hashtags,
                tips: Array.isArray(parsed.tips) ? parsed.tips : [],
                rawText: jsonText
              }
            };
          } catch (structErr) {
            const errStr = String(structErr?.message || structErr || "");
            if (errStr.includes("403") || errStr.toLowerCase().includes("appcheck") || errStr.toLowerCase().includes("forbidden")) {
              throw structErr;
            }
            const fallbackRes = await chatModel.generateContent(fullPrompt);
            const rawText = fallbackRes.response.text();
            return {
              ok: true,
              source: "LIVE_GEMINI",
              data: {
                title: `🔥 ${prompt.slice(0, 60)}`,
                hook: rawText.split("\n")[0] || "",
                script: rawText,
                cta: "अभी सेव करें और शेयर करें!",
                hashtags: "#ViralReels #TrendingShorts #ViralBoostAI #ReelsIndia",
                tips: [],
                rawText
              }
            };
          }
        } catch (aiErr) {
          bridge.lastAiError = String(aiErr?.message || aiErr || "AI request error");
          throw aiErr;
        }
      };

      // Initialize Firebase Authentication & Provisioned Named Cloud Firestore
      const auth = getAuth(app);
      const db = getFirestore(app, FIRESTORE_DB_ID);
      const googleProvider = new GoogleAuthProvider();
      googleProvider.setCustomParameters({ prompt: "select_account" });
      let lbUnsubscribe = null;

      getRedirectResult(auth).catch((redirErr) => {
        if (redirErr?.code) bridge.lastAuthError = redirErr.code;
      });

      bridge.signInWithGoogle = async () => {
        bridge.lastAuthError = "";
        try {
          await signInWithPopup(auth, googleProvider);
          authUiState.googleLoading = false;
          showToast("🟢 Google Cloud Sync Connected!", "success");
        } catch (err) {
          authUiState.googleLoading = false;
          const code = err?.code || "";
          bridge.lastAuthError = code || err?.message || "";
          if (code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment") {
            await signInWithRedirect(auth, googleProvider);
          } else if (code === "auth/unauthorized-domain") {
            const host = window.location.hostname || PRODUCTION_HOST;
            showToast(`Authorize "${host}" in Firebase Console → Authentication → Authorized domains.`, "error");
            renderApp();
          } else if (code !== "auth/popup-closed-by-user") {
            showToast(`Google Sign-In error: ${err.message}`, "error");
            renderApp();
          } else {
            renderApp();
          }
        }
      };

      bridge.signOutGoogle = async () => {
        try {
          await signOut(auth);
          showToast("Signed out of Google Cloud Sync", "info");
        } catch (err) {
          showToast(`Sign-out error: ${err.message}`, "error");
        }
      };

      bridge.syncUserProfileAndLeaderboard = async (profile) => {
        const user = auth.currentUser;
        if (!user || !profile) return;
        try {
          const uid = user.uid;
          const userRef = doc(db, "users", uid);
          const existingSnap = await getDoc(userRef);
          const existingRole = existingSnap.exists() && existingSnap.data()?.role ? existingSnap.data().role : "user";
          const safeName = String(profile.username || user.displayName || "ViralCreator").trim().slice(0, 80) || "ViralCreator";
          const safeCoins = Math.max(0, Math.floor(Number(profile.coins) || 0));
          const safeDiamonds = Math.max(0, Math.floor(Number(profile.diamonds) || 0));
          const now = Date.now();

          await setDoc(userRef, {
            uid,
            displayUserId: String(profile.displayUserId || "74829156"),
            username: safeName,
            email: String(profile.email || user.email || "").trim(),
            userContact: String(profile.userContact || user.email || "").trim(),
            authMethod: String(profile.authMethod || "google"),
            isLoggedIn: Boolean(profile.isLoggedIn),
            hasAgreedToTerms: Boolean(profile.hasAgreedToTerms),
            legalAgreementTimestamp: String(profile.legalAgreementTimestamp || ""),
            niche: String(profile.niche || "Shorts & Reels"),
            coins: safeCoins,
            diamonds: safeDiamonds,
            lifetimeDiamonds: Math.max(0, Math.floor(Number(profile.lifetimeDiamonds) || 0)),
            bonusRupees: Math.floor(Number(profile.bonusRupees) || 50),
            streakDays: Math.max(1, Math.floor(Number(profile.streakDays) || 1)),
            isVip: Boolean(profile.isVip),
            planTier: String(profile.planTier || "FREE_TRIAL"),
            vipExpiryDate: Number(profile.vipExpiresAt || 0),
            role: existingRole,
            updatedAt: now
          });

          const lbRef = doc(db, "leaderboard", uid);
          const handle = "@" + (safeName.toLowerCase().replace(/[^a-z0-9_]/g, "_").slice(0, 24) || "creator");
          await setDoc(lbRef, {
            uid,
            name: safeName,
            handle,
            niche: String(profile.niche || "Shorts & Reels"),
            coins: safeCoins,
            diamonds: safeDiamonds,
            streakDays: Math.max(1, Math.floor(Number(profile.streakDays) || 1)),
            viralScore: safeCoins + (safeDiamonds * 10),
            isVip: Boolean(profile.isVip),
            updatedAt: now
          });
        } catch (err) {
          console.warn("Firestore sync error:", err);
        }
      };

      bridge.submitPayment = async (pay) => {
        const user = auth.currentUser;
        if (!user || !pay) return;
        try {
          await addDoc(collection(db, "payments"), {
            userId: user.uid,
            userName: String(state.profile.username || user.displayName || "Creator"),
            planName: String(pay.planName || "VIP Plan").slice(0, 140),
            amountRupees: Math.max(0, Math.floor(Number(pay.amount) || 0)),
            utrNumber: String(pay.utr || "").slice(0, 40),
            paymentMethod: "UPI_QR",
            status: "PENDING",
            ownerUpiId: CONSTANTS.OWNER_UPI_ID,
            timestamp: Date.now(),
            adminNote: ""
          });
        } catch (err) {
          console.warn("Payment Firestore sync error:", err);
        }
      };

      bridge.submitTicket = async (tkt) => {
        const user = auth.currentUser;
        if (!user || !tkt) return;
        try {
          await addDoc(collection(db, "tickets"), {
            userId: user.uid,
            userName: String(state.profile.username || user.displayName || "Creator"),
            userEmail: String(state.profile.email || user.email || ""),
            subject: String(tkt.subject || "Support Inquiry").slice(0, 160),
            category: String(tkt.category || "General Inquiry"),
            message: String(tkt.message || "").slice(0, 2000),
            status: "OPEN",
            adminReply: "",
            createdAt: Date.now()
          });
        } catch (err) {
          console.warn("Ticket Firestore sync error:", err);
        }
      };

      bridge.recordAffiliateOrder = async (ord) => {
        const user = auth.currentUser;
        if (!user || !ord) return;
        try {
          await addDoc(collection(db, "affiliate_orders"), {
            userId: user.uid,
            productId: String(ord.productId || "DEAL"),
            productTitle: String(ord.productTitle || "Affiliate Deal").slice(0, 160),
            platform: String(ord.platform || "Shopsy"),
            priceRupees: Math.max(0, Math.floor(Number(ord.priceRupees) || 0)),
            affiliateTag: CONSTANTS.AFFILIATE_TAG,
            diamondsRewarded: Math.floor(Number(ord.diamondsRewarded) || 0),
            status: "LOGGED",
            timestamp: Date.now()
          });
        } catch (err) {
          console.warn("Affiliate Firestore sync error:", err);
        }
      };

      onAuthStateChanged(auth, async (user) => {
        bridge.currentUser = user;
        cloudUser = user;
        authUiState.googleLoading = false;
        if (lbUnsubscribe) { lbUnsubscribe(); lbUnsubscribe = null; }

        if (user) {
          try {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
              const d = snap.data();
              if (typeof d.coins === "number") state.profile.coins = d.coins;
              if (typeof d.diamonds === "number") state.profile.diamonds = d.diamonds;
              if (typeof d.lifetimeDiamonds === "number") state.profile.lifetimeDiamonds = d.lifetimeDiamonds;
              if (typeof d.bonusRupees === "number") state.profile.bonusRupees = d.bonusRupees;
              if (typeof d.streakDays === "number") state.profile.streakDays = d.streakDays;
              if (typeof d.isVip === "boolean") state.profile.isVip = d.isVip;
              if (d.planTier) state.profile.planTier = d.planTier;
              if (typeof d.vipExpiryDate === "number") state.profile.vipExpiresAt = d.vipExpiryDate;
              if (d.username) state.profile.username = d.username;
              if (d.email) state.profile.email = d.email;
              if (d.niche) state.profile.niche = d.niche;
              if (d.displayUserId) state.profile.displayUserId = d.displayUserId;

              // Only unlock app automatically if user explicitly agreed to terms in Cloud Firestore
              if (d.hasAgreedToTerms === true) {
                state.profile.hasAgreedToTerms = true;
                state.profile.legalAccepted = true;
                state.profile.legalAgreementTimestamp = d.legalAgreementTimestamp || new Date().toISOString();
                state.profile.isLoggedIn = true;
                state.profile.authMethod = d.authMethod || "google";
              }
              saveState();
            } else {
              if (user.displayName && (!state.profile.username || state.profile.username === "ViralCreator_99")) {
                state.profile.username = user.displayName;
              }
              if (user.email && (!state.profile.email || state.profile.email === "creator@viralboost.ai")) {
                state.profile.email = user.email;
              }
              if (authUiState.pendingGoogleSignup && authUiState.agreed) {
                const ts = new Date().toISOString();
                state.profile.isLoggedIn = true;
                state.profile.hasAgreedToTerms = true;
                state.profile.legalAccepted = true;
                state.profile.legalAgreementTimestamp = ts;
                state.profile.authMethod = "google";
                state.profile.userContact = user.email || user.uid;
                state.profile.welcomeClaimed = true;
                state.legalAuditLogs.unshift({
                  name: state.profile.username,
                  contact: state.profile.userContact,
                  method: "google",
                  timestamp: ts,
                  status: "AGREED_AND_VERIFIED"
                });
                saveState();
                await bridge.syncUserProfileAndLeaderboard(state.profile);
              } else {
                // Pre-fill Sign Up form so new Google user confirms Mandatory Legal Terms before entering
                if (!authUiState.name && user.displayName) authUiState.name = user.displayName;
                if (!authUiState.contact && user.email) {
                  authUiState.contact = user.email;
                  authUiState.method = "email";
                }
                saveState();
              }
            }

            if (authUiState.pendingGoogleSignup && !isUserAuthenticated() && !authUiState.agreed) {
              showToast("Google connected! Please tick Mandatory Legal Terms & tap Complete Sign Up.", "info");
            }
            authUiState.pendingGoogleSignup = false;

            const q = query(collection(db, "leaderboard"), orderBy("viralScore", "desc"), limit(50));
            lbUnsubscribe = onSnapshot(q, (snapshot) => {
              cloudLeaderboard = snapshot.docs.map(docSnap => {
                const cd = docSnap.data() || {};
                return {
                  uid: cd.uid || docSnap.id,
                  name: cd.name || "Creator",
                  niche: cd.niche || "Shorts & Reels",
                  coins: Number(cd.coins) || 0,
                  diamonds: Number(cd.diamonds) || 0,
                  isVip: Boolean(cd.isVip)
                };
              });
              if (isUserAuthenticated() && state.activeTab === "ranks" && !activeOverlay) renderApp();
            }, (err) => console.warn("Leaderboard snapshot:", err));
          } catch (syncErr) {
            console.warn("Cloud restore warning:", syncErr);
          }
        } else {
          cloudLeaderboard = [];
        }
        syncHeader();
        if (!activeOverlay) renderApp();
      });

      syncHeader();
    } catch (initErr) {
      console.error("Firebase initialization warning:", initErr);
    } finally {
      if (resolveReady) resolveReady(bridge);
    }
  </script>
</body>
</html>
